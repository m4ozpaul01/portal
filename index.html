<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-primary: #0a0a0f;
    --bg-secondary: #12121a;
    --bg-card: rgba(255,255,255,0.04);
    --bg-card-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.08);
    --border-active: rgba(99,102,241,0.5);
    --text-primary: #e8e8ed;
    --text-secondary: #94949e;
    --text-muted: #5c5c66;
    --accent: #6366f1;
    --accent-glow: rgba(99,102,241,0.2);
    --green: #22c55e;
    --yellow: #eab308;
    --red: #ef4444;
    --tab-bg: rgba(255,255,255,0.03);
    --tab-active: rgba(99,102,241,0.15);
    --glass: rgba(255,255,255,0.03);
    --glass-border: rgba(255,255,255,0.06);
    --radius: 12px;
    --radius-sm: 8px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── LOGIN OVERLAY ─── */
  #login-overlay {
    position: fixed; inset: 0;
    background: var(--bg-primary);
    display: flex;
    align-items: center; justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(20px);
    transition: opacity 0.5s ease;
  }
  #login-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .login-card {
    background: var(--glass);
    backdrop-filter: blur(24px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 48px 40px;
    width: 380px;
    max-width: 90vw;
    box-shadow: 0 24px 80px rgba(0,0,0,0.6);
  }

  .login-card h1 {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 4px;
    background: linear-gradient(135deg, #818cf8, #6366f1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .login-card .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 32px;
  }

  .login-card .logo-icon {
    font-size: 40px;
    margin-bottom: 16px;
  }

  .input-group {
    margin-bottom: 16px;
  }

  .input-group label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .input-group input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-group input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .login-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius-sm);
    color: white;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    margin-top: 8px;
  }

  .login-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px var(--accent-glow);
  }

  .login-error {
    color: var(--red);
    font-size: 13px;
    margin-top: 12px;
    display: none;
    text-align: center;
  }

  /* ─── DASHBOARD ─── */
  #dashboard {
    display: none;
  }
  #dashboard.active {
    display: block;
  }

  /* Top bar */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .topbar-left .brand {
    font-size: 18px;
    font-weight: 600;
    background: linear-gradient(135deg, #818cf8, #6366f1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .topbar-left .brand-sub {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .metric-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
  }

  .metric-badge .label {
    color: var(--text-secondary);
    font-weight: 400;
  }

  .metric-badge .value {
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
  }

  .metric-badge .value.kredyt {
    color: var(--yellow);
  }
  .metric-badge .value.tokens {
    color: var(--accent);
  }

  .logout-btn {
    padding: 8px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s;
  }
  .logout-btn:hover {
    background: rgba(239,68,68,0.1);
    border-color: var(--red);
    color: var(--red);
  }

  /* Tab bar */
  .tab-bar {
    display: flex;
    align-items: stretch;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    overflow-x: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .tab-bar::-webkit-scrollbar {
    height: 3px;
  }
  .tab-bar::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
    user-select: none;
    background: transparent;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: inherit;
  }

  .tab:hover {
    color: var(--text-primary);
    background: var(--tab-bg);
  }

  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: var(--tab-active);
  }

  .tab .tab-icon {
    font-size: 16px;
  }

  .tab .tab-status {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }
  .tab .tab-status.active { background: var(--green); }
  .tab .tab-status.paused { background: var(--yellow); }
  .tab .tab-status.done { background: var(--text-muted); }

  /* Content area */
  .content-area {
    padding: 32px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .tab-content {
    display: none;
    animation: fadeIn 0.25s ease;
  }
  .tab-content.active {
    display: block;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ─── STATUS CARDS ─── */
  .project-tab-header {
    margin-bottom: 24px;
  }

  .project-tab-header h2 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .project-tab-header p {
    color: var(--text-secondary);
    font-size: 14px;
  }

  .project-content-area {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    min-height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .project-content-area .placeholder {
    text-align: center;
  }

  .project-content-area .placeholder .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }

  .project-content-area .placeholder h3 {
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 8px;
    color: var(--text-secondary);
  }

  .project-content-area .placeholder p {
    color: var(--text-muted);
    font-size: 14px;
    max-width: 400px;
    line-height: 1.6;
  }

  /* ─── STATUS CARDS ─── */
  .status-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }

  .status-card .status-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .status-card .status-item:last-child {
    border-bottom: none;
  }

  .status-card .status-label {
    font-size: 14px;
    color: var(--text-secondary);
  }

  .status-card .status-value {
    font-size: 14px;
    font-weight: 500;
  }

  .status-card .status-value.green { color: var(--green); }
  .status-card .status-value.yellow { color: var(--yellow); }
  .status-card .status-value.red { color: var(--red); }

  /* ─── EVENT CARDS ─── */
  .events-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-top: 8px;
  }

  .event-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: all 0.3s;
    display: flex;
    flex-direction: column;
  }

  .event-card:hover {
    border-color: var(--border-active);
  }

  .event-card.done {
    opacity: 0.3;
    display: none;
  }

  .event-card .event-img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    background: var(--bg-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
  }

  .event-card .event-body {
    padding: 24px;
  }

  .event-card .event-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .event-card .event-date {
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-secondary);
    background: var(--bg-secondary);
    padding: 4px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  .event-card .event-type {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 12px;
    border-radius: 12px;
  }

  .event-type.Meteor { background: rgba(99,102,241,0.15); color: #818cf8; }
  .event-type.Eclipse { background: rgba(239,68,68,0.15); color: #f87171; }
  .event-type.Planetary { background: rgba(34,197,94,0.15); color: #4ade80; }
  .event-type.Seasonal { background: rgba(234,179,8,0.15); color: #facc15; }
  .event-type.Comet { background: rgba(168,85,247,0.15); color: #c084fc; }
  .event-type-badge.Meteor { background: rgba(99,102,241,0.15); color: #818cf8; }
  .event-type-badge.Eclipse { background: rgba(239,68,68,0.15); color: #f87171; }
  .event-type-badge.Planetary { background: rgba(34,197,94,0.15); color: #4ade80; }
  .event-type-badge.Seasonal { background: rgba(234,179,8,0.15); color: #facc15; }
  .event-type-badge.Comet { background: rgba(168,85,247,0.15); color: #c084fc; }

  .event-card .event-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .event-card .event-desc {
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .event-card .event-observe {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-bottom: 16px;
  }

  .event-card .event-observe-label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .event-card .event-observe-text {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
  }

  .event-card .took-part-btn {
    padding: 10px 24px;
    background: transparent;
    border: 1px solid var(--green);
    border-radius: var(--radius-sm);
    color: var(--green);
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    align-self: flex-start;
  }

  .event-card .took-part-btn:hover {
    background: rgba(34,197,94,0.1);
    transform: translateY(-1px);
  }

  .events-empty {
    text-align: center;
    padding: 64px 32px;
    color: var(--text-muted);
  }

  .events-empty .icon {
    font-size: 64px;
    margin-bottom: 16px;
  }

  .events-empty h3 {
    font-size: 18px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 768px) {
    .topbar { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
    .topbar-right { gap: 12px; }
    .metric-badge { padding: 6px 12px; font-size: 12px; }
    .content-area { padding: 16px; }
    .tab { padding: 10px 14px; font-size: 12px; }
    .login-card { padding: 32px 24px; }
  }

  /* ─── OVERVIEW HIGHLIGHTS ─── */
  .overview-highlights {
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-top: 8px;
  }

  .overview-section {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .overview-section:hover {
    border-color: var(--border-active);
    background: var(--bg-card-hover);
    transform: translateY(-2px);
  }

  .overview-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    border-radius: var(--radius) var(--radius) 0 0;
  }

  .overview-section .os-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }

  .overview-section .os-header .os-icon {
    font-size: 16px;
  }

  .overview-section .os-header .os-tab-name {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--accent);
  }

  .overview-section .os-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .overview-section .os-meta {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .overview-section .os-desc {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-top: 6px;
  }

  .overview-section .os-status-label {
    font-size: 13px;
    color: var(--text-muted);
  }

  .overview-section .os-status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }

  .os-status-dot.active { background: var(--green); }
  .os-status-dot.paused { background: var(--yellow); }
  .os-status-dot.done { background: var(--text-muted); }

  .event-type-badge {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
    flex-shrink: 0;
  }

  /* ─── LAST UPDATED ─── */

/* ─── FRANKFURT EVENTS LIST ─── */
.frankfurt-events-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 8px;
}

.frankfurt-event-item {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.frankfurt-event-item:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-active);
  transform: translateX(4px);
}

.frankfurt-event-item .fe-title {
  font-size: 15px;
  font-weight: 500;
  color: var(--text-primary);
}

.frankfurt-event-item .fe-date {
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-secondary);
  background: var(--bg-secondary);
  padding: 4px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  white-space: nowrap;
}

.frankfurt-event-item .fe-category {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 20px;
  background: rgba(99,102,241,0.12);
  color: #818cf8;
  white-space: nowrap;
}

/* ─── FRANKFURT EVENT MODAL ─── */
.event-modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(8px);
  z-index: 999;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.event-modal-overlay.active {
  display: flex;
}

.event-modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 16px;
  max-width: 640px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  animation: modalIn 0.25s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(20px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.event-modal-header {
  padding: 24px 28px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.event-modal-header h2 {
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
  flex: 1;
}

.event-modal-close {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 50%;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 18px;
  transition: all 0.15s;
  flex-shrink: 0;
}

.event-modal-close:hover {
  background: rgba(239,68,68,0.1);
  border-color: var(--red);
  color: var(--red);
}

.event-modal-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 0 28px;
  margin-top: 12px;
}

.event-modal-meta .meta-tag {
  font-size: 12px;
  padding: 5px 12px;
  border-radius: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 5px;
}

.event-modal-meta .meta-tag .tag-icon {
  font-size: 14px;
}

.event-modal-body {
  padding: 20px 28px 28px;
}

.event-modal-body .detail-section {
  margin-bottom: 18px;
}

.event-modal-body .detail-section:last-child {
  margin-bottom: 0;
}

.event-modal-body .detail-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--accent);
  margin-bottom: 6px;
}

.event-modal-body .detail-text {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.6;
}

.event-modal-img {
  width: 100%;
  max-height: 260px;
  object-fit: cover;
  border-radius: 10px;
  background: var(--bg-primary);
  margin-bottom: 18px;
  display: block;
}

.event-modal-img-placeholder {
  width: 100%;
  height: 160px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--bg-card), var(--bg-secondary));
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  color: var(--text-muted);
  margin-bottom: 18px;
}

  .update-footer {
    text-align: center;
    padding: 32px;
    margin-top: 48px;
    color: var(--text-muted);
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    border-top: 1px solid var(--border);
  }

/* Hessen Events */
.hessen-controls {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 16px 20px;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.hessen-slider-group {

<script>
// ════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════

const CONFIG_URL = 'config.json?_=' + Date.now();
const SESSION_KEY = 'portal_auth';

// ════════════════════════════════════════
// LOGIN
// ════════════════════════════════════════

async function hashPassword(password) {
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(password));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const user = document.getElementById('login-user').value.trim();
  const pass = document.getElementById('login-pass').value;
  const errorEl = document.getElementById('login-error');

  try {
    const resp = await fetch(CONFIG_URL);
    const config = await resp.json();

    const hash = await hashPassword(pass);

    // Check against all registered users
    const creds = Array.isArray(config.credentials) ? config.credentials : [config.credentials];
    const match = creds.find(c => user === c.username && hash === c.password_hash);

    if (match) {
      sessionStorage.setItem(SESSION_KEY, 'true');
      errorEl.style.display = 'none';
      initPortal(config);
    } else {
      errorEl.style.display = 'block';
    }
  } catch (err) {
    errorEl.textContent = 'Failed to load portal config. Try again.';
    errorEl.style.display = 'block';
  }
});

// ════════════════════════════════════════
// PORTAL INIT
// ════════════════════════════════════════

function initPortal(config) {
  document.getElementById('login-overlay').classList.add('hidden');
  document.getElementById('dashboard').classList.add('active');

  // Set metrics
  document.getElementById('kredyt-value').textContent = '$' + (config.kredyt ?? 0);
  document.getElementById('tokens-value').textContent = (config.tokens ?? 0).toLocaleString();
  document.getElementById('model-value').textContent = config.model || '—';

  // Build tabs
  buildTabs(config);

  // Load highlights for Overview tab (first item from each tab)
  loadOverviewHighlights(config);

  // Footer
  document.getElementById('update-footer').textContent = 'Last updated: ' + (config.last_updated || '—');
}

// ════════════════════════════════════════
// TABS
// ════════════════════════════════════════

function buildTabs(config) {
  const tabBar = document.getElementById('tab-bar');
  const dynamicTabs = document.getElementById('dynamic-tabs');
  dynamicTabs.innerHTML = '';

  (config.projects || []).forEach(project => {
    // Tab button
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.dataset.tab = 'project-' + project.name;
    btn.setAttribute('onclick', "switchTab('project-" + project.name + "')");
    btn.innerHTML = `
      <span class="tab-status ${project.status}"></span>
      ${project.name}
    `;
    tabBar.appendChild(btn);

    // Tab content
    const content = document.createElement('div');
    content.className = 'tab-content';
    content.id = 'tab-project-' + project.name;
    content.innerHTML = buildProjectContent(project);
    dynamicTabs.appendChild(content);
  });
}

function buildProjectContent(project) {
  if (project.name === 'natural events') {
    return `
      <div class="project-tab-header">
        <h2>🔭 Natural Events</h2>
        <p>${project.description || 'Upcoming celestial and natural events'}</p>
      </div>
      <div id="events-container-${project.name}" class="events-container">
        <div style="text-align:center;padding:64px;color:var(--text-muted);">
          <div style="font-size:48px;margin-bottom:16px;">🔭</div>
          <p>Loading celestial events...</p>
        </div>
      </div>
    `;
  }
  if (project.display === 'hessen_events') {
    return `
      <div class="project-tab-header">
        <h2>🌍 Hessen Events</h2>
        <p>${project.description || 'Events across Hessen state — filtered by distance from Frankfurt'}</p>
        <p style="font-size:12px;color:var(--text-muted);margin-top:4px;">🔍 Researched every Sunday · Drag slider to set max distance · Click for details + maps link</p>
      </div>
      <div class="hessen-controls">
        <div class="hessen-slider-group">
          <span class="hessen-slider-label">📍 Distance from Frankfurt:</span>
          <input type="range" class="hessen-slider" id="hessen-distance-slider" min="0" max="300" value="300" step="5">
          <span class="hessen-slider-value" id="hessen-slider-value">300 km</span>
        </div>
        <span class="hessen-event-count" id="hessen-event-count">Showing events</span>
      </div>
      <div id="hessen-events-container" class="frankfurt-events-list">
        <div style="text-align:center;padding:64px;color:var(--text-muted);">
          <div style="font-size:48px;margin-bottom:16px;">🌍</div>
          <p>Loading Hessen events...</p>
        </div>
      </div>
    `;
  }

  if (project.display === 'frankfurt_events') {
    return `
      <div class="project-tab-header">
        <h2>🎪 Frankfurt Events</h2>
        <p>${project.description || 'Curated cultural and social events in Frankfurt'}</p>
        <p style="font-size:12px;color:var(--text-muted);margin-top:4px;">🔍 Researched every Sunday · Click any event for details</p>
      </div>
      <div id="frankfurt-events-container" class="frankfurt-events-list">
        <div style="text-align:center;padding:64px;color:var(--text-muted);">
          <div style="font-size:48px;margin-bottom:16px;">🎪</div>
          <p>Loading Frankfurt events...</p>
        </div>
      </div>
    `;
  }
  const display = project.display || 'placeholder';
  let body = '';

  if (display === 'placeholder' || display === 'status_card') {
    body = `
      <div class="project-content-area">
        <div class="placeholder">
          <div class="icon">🚀</div>
          <h3>${project.name}</h3>
          <p>${project.description || 'No description yet.'}</p>
        </div>
      </div>
    `;
  }

  return `
    <div class="project-tab-header">
      <h2>📁 ${project.name}</h2>
      <p>${project.description || ''}</p>
    </div>
    ${body}
  `;
}

// ════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════

function getEventEmoji(type) {
  const map = {
    'Meteor Shower': '☄️',
    'Meteor': '☄️',
    'Eclipse': '🌑',
    'Planetary Event': '🪐',
    'Planet': '🪐',
    'Seasonal Event': '🌞',
    'Comet': '☄️',
  };
  return map[type] || '🔭';
}

function getTypeClass(type) {
  if (type.includes('Meteor')) return 'Meteor';
  if (type.includes('Eclipse')) return 'Eclipse';
  if (type.includes('Planet')) return 'Planetary';
  if (type.includes('Seasonal')) return 'Seasonal';
  if (type.includes('Comet')) return 'Comet';
  return 'Planetary';
}

function getCategoryEmoji(category) {
  const map = {
    'Music & Opera': '🎵',
    'Festival & Culture': '🎉',
    'Literature & Arts': '📚',
    'Art & Exhibitions': '🖼️',
    'Food & Drink': '🍽️',
    'Convention & Pop Culture': '🎮',
    'Film & Cinema': '🎬',
    'Seasonal & Markets': '🎄',
    'Markets & Shopping': '🛍️',
    'Sports': '⚽',
    'Nightlife & Social': '🌙',
    'Family & Education': '👨‍👩‍👧‍👦',
  };
  return map[category] || '🎪';
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
  return d.toLocaleDateString('en-GB', options);
}

// ════════════════════════════════════════
// LANDING PAGE — OVERVIEW HIGHLIGHTS
// ════════════════════════════════════════

async function loadOverviewHighlights(config) {
  const container = document.getElementById('overview-highlights');
  if (!container) return;

  const today = new Date().toISOString().split('T')[0];

  // Load celestial events
  let celestialEvents = [];
  try {
    const resp = await fetch(EVENTS_URL);
    const data = await resp.json();
    const tookPart = getTookPartIds();
    celestialEvents = (data.events || [])
      .filter(e => e.date >= today && !tookPart.includes(e.date + '-' + e.title))
      .sort((a, b) => a.date.localeCompare(b.date));
  } catch {}

  // Load Frankfurt events
  let frankfurtEvents = [];
  let hessenEvents = [];
  try {
    const resp = await fetch(FRANKFURT_EVENTS_URL);
    const data = await resp.json();
    frankfurtEvents = (data.events || [])
      .filter(e => e.date >= today)
      .sort((a, b) => a.date.localeCompare(b.date));
  } catch {}

  // Load Hessen events
  try {
    const resp = await fetch(HESSEN_EVENTS_URL);
    const data = await resp.json();
    hessenEvents = (data.events || [])
      .filter(e => e.date >= today)
      .sort((a, b) => a.date.localeCompare(b.date));
  } catch {}

  // Tab icon & label mapping (add new tabs here when created)
  const tabInfo = {
    'natural events': { icon: '🔭', label: 'Sky Events' },
    'Frankfurt Events': { icon: '🎪', label: 'Frankfurt Events' },
    'Hessen Events': { icon: '🌍', label: 'Hessen Events' },
  };

  container.innerHTML = '';

  // Render one section per project — first upcoming item from each tab
  (config.projects || []).forEach(project => {
    const info = tabInfo[project.name] || { icon: '📁', label: project.name };
    const section = document.createElement('div');
    section.className = 'overview-section';
    section.onclick = () => switchTab('project-' + project.name);

    if (project.display === 'events' && celestialEvents.length > 0) {
      const first = celestialEvents[0];
      section.innerHTML = `
        <div class="os-header">
          <span class="os-icon">${info.icon}</span>
          <span class="os-tab-name">${info.label}</span>
        </div>
        <div class="os-title">${getEventEmoji(first.type)} ${first.title}</div>
        <div class="os-meta">
          <span>📅 ${first.date}</span>
          <span class="event-type-badge ${getTypeClass(first.type)}">${first.type}</span>
        </div>
        <div class="os-desc">${first.description}</div>
      `;
    } else if (project.display === 'hessen_events' && hessenEvents.length > 0) {
      const first = hessenEvents[0];
      section.innerHTML = `
        <div class="os-header">
          <span class="os-icon">${info.icon}</span>
          <span class="os-tab-name">${info.label}</span>
        </div>
        <div class="os-title">${getCategoryEmoji(first.category)} ${first.title}</div>
        <div class="os-meta">
          <span>📅 ${formatDate(first.date)}</span>
          <span>📍 ${first.distance_from_frankfurt_km || 0} km</span>
        </div>
        <div class="os-desc">${first.description || ''}</div>
      `;
    } else if (project.display === 'frankfurt_events' && frankfurtEvents.length > 0) {
      const first = frankfurtEvents[0];
      section.innerHTML = `
        <div class="os-header">
          <span class="os-icon">${info.icon}</span>
          <span class="os-tab-name">${info.label}</span>
        </div>
        <div class="os-title">${getCategoryEmoji(first.category)} ${first.title}</div>
        <div class="os-meta">
          <span>📅 ${formatDate(first.date)}</span>
          <span>${first.category || 'Event'}</span>
        </div>
        <div class="os-desc">${first.description || ''}</div>
      `;
    } else {
      // Default: project status card
      const statusDot = project.status || 'active';
      section.innerHTML = `
        <div class="os-header">
          <span class="os-icon">${info.icon}</span>
          <span class="os-tab-name">${info.label}</span>
        </div>
        <div class="os-title" style="font-size:15px;color:var(--text-secondary);font-weight:500;">
          <span class="os-status-dot ${statusDot}"></span>${project.name}
        </div>
        <div class="os-desc">${project.description || 'No description.'}</div>
      `;
    }

    container.appendChild(section);
  });
}

// ════════════════════════════════════════
// TAB SWITCHING
// ════════════════════════════════════════

function switchTab(tabId) {
  // Deactivate all tabs
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

  // Activate target
  const tabBtn = document.querySelector(`.tab[data-tab="${tabId}"]`);
  const tabContent = document.getElementById('tab-' + tabId);
  if (tabBtn) tabBtn.classList.add('active');
  if (tabContent) tabContent.classList.add('active');

  // Load events when natural events or Frankfurt events tab opens
  if (tabId === 'project-natural events') {
    loadEvents('events-container-natural events', 'natural events');
  }
  if (tabId === 'project-Frankfurt Events') {
    loadFrankfurtEvents();
  }
  if (tabId === 'project-Hessen Events') {
    loadHessenEvents();
  }
}

// ════════════════════════════════════════
// LOGOUT
// ════════════════════════════════════════

function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  document.getElementById('login-overlay').classList.remove('hidden');
  document.getElementById('dashboard').classList.remove('active');
  document.getElementById('login-pass').value = '';
}

// ════════════════════════════════════════
// NATURAL EVENTS
// ════════════════════════════════════════

const EVENTS_URL = 'events.json?_=' + Date.now();
const TOOK_PART_KEY = 'portal_took_part';

function getTookPartIds() {
  try {
    return JSON.parse(localStorage.getItem(TOOK_PART_KEY) || '[]');
  } catch { return []; }
}

function markTookPart(eventId) {
  const ids = getTookPartIds();
  if (!ids.includes(eventId)) {
    ids.push(eventId);
    localStorage.setItem(TOOK_PART_KEY, JSON.stringify(ids));
  }
}

async function loadEvents(containerId, projectName) {
  const container = document.getElementById(containerId);
  if (!container) return;

  try {
    const resp = await fetch(EVENTS_URL);
    const data = await resp.json();
    renderEvents(container, data.events || [], projectName);
  } catch (err) {
    container.innerHTML = `
      <div class="events-empty">
        <div class="icon">🔭</div>
        <h3>Could not load events</h3>
        <p>Events data not yet available. Research runs every Sunday.</p>
      </div>
    `;
  }
}

function renderEvents(container, events, projectName) {
  const tookPart = getTookPartIds();
  const today = new Date().toISOString().split('T')[0];

  // Filter past events and took-part events
  const upcoming = events.filter(e => e.date >= today && !tookPart.includes(e.date + '-' + e.title));

  if (upcoming.length === 0) {
    container.innerHTML = `
      <div class="events-empty">
        <div class="icon">🌌</div>
        <h3>No upcoming events</h3>
        <p>All caught up! New events will appear after Sunday's research.</p>
      </div>
    `;
    return;
  }

  // Sort by date (closest first)
  upcoming.sort((a, b) => a.date.localeCompare(b.date));

  container.innerHTML = upcoming.map(event => {
    const eventId = event.date + '-' + event.title;
    const emoji = getEventEmoji(event.type);
    const typeClass = getTypeClass(event.type);

    return `
      <div class="event-card" id="event-${eventId.replace(/[^a-zA-Z0-9-]/g, '_')}">
        <div class="event-img">${emoji}</div>
        <div class="event-body">
          <div class="event-meta">
            <span class="event-date">${event.date}</span>
            <span class="event-type ${typeClass}">${event.type}</span>
          </div>
          <div class="event-title">${event.title}</div>
          <div class="event-desc">${event.description}</div>
          <div class="event-observe">
            <div class="event-observe-label">🔭 How to Observe</div>
            <div class="event-observe-text">${event.how_to_observe}</div>
          </div>
          <button class="took-part-btn" onclick="handleTookPart('${eventId.replace(/[^a-zA-Z0-9-]/g, '_')}', '${eventId}')">
            ✅ I Took Part!
          </button>
        </div>
      </div>
    `;
  }).join('');
}

// ════════════════════════════════════════
// FRANKFURT EVENTS
// ════════════════════════════════════════

const FRANKFURT_EVENTS_URL = 'frankfurt_events.json?_=' + Date.now();

async function loadFrankfurtEvents() {
  const container = document.getElementById('frankfurt-events-container');
  if (!container) return;

  try {
    const resp = await fetch(FRANKFURT_EVENTS_URL);
    const data = await resp.json();
    const events = data.events || [];
    renderFrankfurtEventList(container, events);
  } catch (err) {
    container.innerHTML = `
      <div class="events-empty">
        <div class="icon">🎪</div>
        <h3>Could not load events</h3>
        <p>Events data not yet available. New research runs every Sunday at 3 AM.</p>
      </div>
    `;
  }
}

function renderFrankfurtEventList(container, events) {
  const today = new Date().toISOString().split('T')[0];

  // Filter to only upcoming events
  const upcoming = events.filter(e => e.date >= today);

  if (upcoming.length === 0) {
    container.innerHTML = `
      <div class="events-empty">
        <div class="icon">🎪</div>
        <h3>No upcoming events</h3>
        <p>New events will be researched every Sunday.</p>
      </div>
    `;
    return;
  }

  // Sort by date (soonest first)
  upcoming.sort((a, b) => a.date.localeCompare(b.date));

  container.innerHTML = upcoming.map((event, index) => `
    <div class="frankfurt-event-item" onclick="openFrankfurtModal(${index})" data-event-index="${index}">
      <span class="fe-title">${event.title}</span>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="fe-category">${event.category || 'Event'}</span>
        <span class="fe-date">${formatDate(event.date)}</span>
      </div>
    </div>
  `).join('');

  // Store events data for modal access
  window.__frankfurtEvents = upcoming;
}

function handleTookPart(elementId, eventId) {
  markTookPart(eventId);
  const card = document.getElementById('event-' + elementId);
  if (card) {
    card.classList.add('done');
    card.style.display = 'none';
  }
}

// ════════════════════════════════════════
// FRANKFURT EVENT MODAL
// ════════════════════════════════════════

function openFrankfurtModal(index) {
  const events = window.__frankfurtEvents;
  if (!events || !events[index]) return;

  const event = events[index];
  const overlay = document.getElementById('event-modal-overlay');
  const title = document.getElementById('modal-title');
  const meta = document.getElementById('modal-meta');
  const body = document.getElementById('modal-body');

  if (!overlay || !title || !meta || !body) return;

  title.textContent = getCategoryEmoji(event.category) + ' ' + event.title;

  // Meta tags
  meta.innerHTML = `
    <span class="meta-tag"><span class="tag-icon">📅</span> ${formatDate(event.date)}</span>
    ${event.time ? `<span class="meta-tag"><span class="tag-icon">⏰</span> ${event.time}</span>` : ''}
    <span class="meta-tag"><span class="tag-icon">🏷️</span> ${event.category || 'Event'}</span>
  `;

  renderEventModalBody(body, event);
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function openHessenModal(index) {
  const events = window.__hessenFilteredEvents || window.__hessenEvents;
  if (!events || !events[index]) return;

  const event = events[index];
  const overlay = document.getElementById('event-modal-overlay');
  const title = document.getElementById('modal-title');
  const meta = document.getElementById('modal-meta');
  const body = document.getElementById('modal-body');

  if (!overlay || !title || !meta || !body) return;

  title.textContent = getCategoryEmoji(event.category) + ' ' + event.title;

  const dist = event.distance_from_frankfurt_km || 0;
  const distText = dist < 1 ? '< 1 km' : dist.toFixed(0) + ' km';

  meta.innerHTML = `
    <span class="meta-tag"><span class="tag-icon">📅</span> ${formatDate(event.date)}</span>
    ${event.time ? `<span class="meta-tag"><span class="tag-icon">⏰</span> ${event.time}</span>` : ''}
    <span class="meta-tag"><span class="tag-icon">🏷️</span> ${event.category || 'Event'}</span>
    <span class="meta-tag"><span class="tag-icon">🏙️</span> ${event.city || ''}</span>
    <span class="meta-tag"><span class="tag-icon">📍</span> ${distText}</span>
  `;

  renderEventModalBody(body, event, distText);
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

// Shared modal body renderer — used by both Frankfurt and Hessen modals
function renderEventModalBody(body, event, extraDist) {
  let html = '';

  if (event.image_url) {
    html += `<img class="event-modal-img" src="${event.image_url}" alt="${event.title}" onerror="this.style.display='none'">`;
  } else {
    html += `<div class="event-modal-img-placeholder">${getCategoryEmoji(event.category)}</div>`;
  }

  html += `
    <div class="detail-section">
      <div class="detail-label">📖 Description</div>
      <div class="detail-text">${event.description}</div>
    </div>
    <div class="detail-section">
      <div class="detail-label">📍 Location</div>
      <div class="detail-text">${event.location}</div>
    </div>
    <div class="detail-section">
      <div class="detail-label">💰 Cost</div>
      <div class="detail-text">${event.cost_per_person || 'Free'}</div>
    </div>
  `;

  // Add distance + maps link for Hessen events
  if (extraDist) {
    html += `
      <div class="detail-section">
        <div class="detail-label">📍 Distance from Frankfurt</div>
        <div class="detail-text">${extraDist}</div>
      </div>
      <div class="detail-section">
        <a href="${event.google_maps_link || '#'}" target="_blank" rel="noopener noreferrer" class="maps-link">
          🗺️ Open in Google Maps
        </a>
      </div>
    `;
  }

  body.innerHTML = html;
}

function closeFrankfurtModal(event) {
  if (event && event.target !== event.currentTarget) return;
  const overlay = document.getElementById('event-modal-overlay');
  if (overlay) {
    overlay.classList.remove('active');
    document.body.style.overflow = '';
  }
}

// Close modal on Escape key
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    const modal = document.getElementById('event-modal-overlay');
    if (modal && modal.classList.contains('active')) {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }
  }
});

// ════════════════════════════════════════

(async function() {
  if (sessionStorage.getItem(SESSION_KEY) === 'true') {
    try {
      const resp = await fetch(CONFIG_URL);
      const config = await resp.json();
      initPortal(config);
    } catch (_) {
      // Config not loaded yet, user logs in manually
    }
  }
})();

// ════════════════════════════════════════
// HESSEN EVENTS
// ════════════════════════════════════════

const HESSEN_EVENTS_URL = 'hessen_events.json?_=' + Date.now();

async function loadHessenEvents() {
  const container = document.getElementById('hessen-events-container');
  if (!container) return;

  try {
    const resp = await fetch(HESSEN_EVENTS_URL);
    const data = await resp.json();
    const events = data.events || [];
    window.__hessenEvents = events;
    // Initialize slider BEFORE first render so the default value is applied
    setupHessenSlider(events);
    // First render uses the slider's current value
    const slider = document.getElementById('hessen-distance-slider');
    const initialDist = slider ? parseInt(slider.value) : 300;
    renderHessenEventList(container, events, initialDist);
  } catch (err) {
    container.innerHTML = `
      <div class="events-empty">
        <div class="icon">🌍</div>
        <h3>Could not load events</h3>
        <p>Events data not yet available. New research runs every Sunday at 4 AM.</p>
      </div>
    `;
  }
}

function setupHessenSlider(allEvents) {
  const slider = document.getElementById('hessen-distance-slider');
  const valueDisplay = document.getElementById('hessen-slider-value');
  const container = document.getElementById('hessen-events-container');
  if (!slider || !valueDisplay || !container) return;

  // Set initial display
  valueDisplay.textContent = slider.value + ' km';

  const update = () => {
    const maxDist = parseInt(slider.value);
    valueDisplay.textContent = maxDist + ' km';
    renderHessenEventList(container, allEvents, maxDist);
  };

  // Real-time update as the slider is dragged (option 2 — best UX)
  slider.addEventListener('input', update);
}

function renderHessenEventList(container, events, maxDistance) {
  const today = new Date().toISOString().split('T')[0];

  // Filter to upcoming events
  let filtered = events.filter(e => e.date >= today);

  // Filter by distance slider
  if (typeof maxDistance === 'number') {
    filtered = filtered.filter(e => (e.distance_from_frankfurt_km || 0) <= maxDistance);
  }

  // Sort by distance (closest first)
  filtered.sort((a, b) => (a.distance_from_frankfurt_km || 0) - (b.distance_from_frankfurt_km || 0));

  const countDisplay = document.getElementById('hessen-event-count');
  if (countDisplay) {
    countDisplay.textContent = filtered.length === 1 ? '1 event found' : filtered.length + ' events found';
  }

  // Store filtered events for modal access (use a Map keyed by event title+date for reliability)
  window.__hessenFilteredEvents = filtered;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="events-empty">
        <div class="icon">🌍</div>
        <h3>No events within range</h3>
        <p>Try increasing the distance slider to find more events across Hessen.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = filtered.map((event, index) => {
    const dist = event.distance_from_frankfurt_km || 0;
    const distText = dist < 1 ? '< 1 km' : dist.toFixed(0) + ' km from Frankfurt';

    return `
      <div class="hessen-event-item" onclick="openHessenModal(${index})" data-he-idx="${index}">
        <div class="hessen-event-top">
          <span class="hessen-event-title">${getCategoryEmoji(event.category)} ${escapeHtml(event.title)}</span>
          <span class="hessen-event-distance">📍 ${distText}</span>
        </div>
        <div class="hessen-event-bottom">
          <span class="hessen-event-city">🏙️ ${event.city || ''}</span>
          <span class="hessen-event-category">${event.category || 'Event'}</span>
          <span class="hessen-event-date-badge">📅 ${formatDate(event.date)}</span>
        </div>
      </div>
    `;
  }).join('');
}

// Simple HTML escape helper (shared between all event renderers)
function escapeHtml(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
