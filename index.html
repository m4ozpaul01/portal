<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root {
  --bg: #0a0a0f;
  --bg2: #12121a;
  --card: rgba(255,255,255,0.04);
  --card-hover: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.08);
  --border-active: rgba(99,102,241,0.5);
  --text: #e8e8ed;
  --text2: #94949e;
  --text3: #5c5c66;
  --accent: #6366f1;
  --accent-glow: rgba(99,102,241,0.2);
  --green: #22c55e;
  --yellow: #eab308;
  --red: #ef4444;
  --radius: 12px;
  --radius-sm: 8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',-apple-system,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

/* LOGIN OVERLAY */
#login-overlay{
  position:fixed;inset:0;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;
  transition:opacity .4s;
}
#login-overlay.hidden{opacity:0;pointer-events:none}
.login-card{
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  border-radius:20px;
  padding:48px 40px;
  width:380px;max-width:90vw;
}
.login-icon{font-size:40px;margin-bottom:16px}
.login-card h1{font-size:28px;font-weight:600;margin-bottom:4px;background:linear-gradient(135deg,#818cf8,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-card .sub{color:var(--text2);font-size:14px;margin-bottom:32px}
.login-group{margin-bottom:16px}
.login-group label{display:block;font-size:12px;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.login-group input{
  width:100%;padding:12px 16px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text);font-size:15px;font-family:inherit;
  outline:none;transition:border-color .2s;
}
.login-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.login-btn{
  width:100%;padding:12px;
  background:var(--accent);border:none;
  border-radius:var(--radius-sm);
  color:#fff;font-size:15px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:transform .15s,box-shadow .15s;
  margin-top:8px;
}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px var(--accent-glow)}
.login-error{color:var(--red);font-size:13px;margin-top:12px;display:none;text-align:center}
/* DIVIDER */
.login-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text3);font-size:12px}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}
/* GOOGLE BUTTON WRAPPER */
#gbutton-wrap{display:flex;justify-content:center;min-height:48px;margin-top:4px}

/* DASHBOARD */
#dashboard{display:none}
#dashboard.active{display:block}

.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 32px;border-bottom:1px solid var(--border);
  background:var(--bg2);position:sticky;top:0;z-index:100;
}
.topbar-left{display:flex;align-items:center;gap:12px}
.brand{font-size:18px;font-weight:600;background:linear-gradient(135deg,#818cf8,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand-sub{font-size:12px;color:var(--text3);font-weight:400}
.topbar-right{display:flex;align-items:center;gap:24px}
.metric-badge{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);border:1px solid var(--border);border-radius:20px;font-size:13px;font-weight:500}
.metric-badge .lbl{color:var(--text2);font-weight:400}
.metric-badge .val{font-family:'JetBrains Mono',monospace;font-size:14px}
.metric-badge .val.credit{color:var(--yellow)}
.metric-badge .val.tokens{color:var(--accent)}
.logout-btn{
  padding:8px 16px;background:transparent;
  border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text2);font-size:13px;font-family:inherit;
  cursor:pointer;transition:all .15s;
}
.logout-btn:hover{background:rgba(239,68,68,0.1);border-color:var(--red);color:var(--red)}

/* TAB BAR */
.tab-bar{
  display:flex;align-items:stretch;
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:0 16px;overflow-x:auto;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.tab-bar::-webkit-scrollbar{height:3px}
.tab-bar::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.tab{
  display:flex;align-items:center;gap:8px;
  padding:12px 20px;font-size:13px;font-weight:500;
  color:var(--text2);cursor:pointer;white-space:nowrap;
  border:none;border-bottom:2px solid transparent;
  background:transparent;font-family:inherit;
  transition:all .15s;user-select:none;
}
.tab:hover{color:var(--text);background:rgba(255,255,255,0.03)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(99,102,241,0.15)}
.tab .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.tab .dot.active{background:var(--green)}
.tab .dot.paused{background:var(--yellow)}
.tab .dot.done{background:var(--text3)}

.content-area{padding:32px;max-width:1200px;margin:0 auto}
.tab-content{display:none;animation:fadeIn .25s ease}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* OVERVIEW */
.overview-sections{display:flex;flex-direction:column;gap:16px;margin-top:8px}
.os-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:20px 24px;
  cursor:pointer;transition:all .2s;position:relative;overflow:hidden;
}
.os-card:hover{border-color:var(--border-active);background:var(--card-hover);transform:translateY(-2px)}
.os-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent)}
.os-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.os-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}
.os-title{font-size:16px;font-weight:600;margin-bottom:4px}
.os-meta{font-size:13px;color:var(--text2);display:flex;gap:12px;flex-wrap:wrap}
.os-desc{font-size:13px;color:var(--text2);line-height:1.5;margin-top:6px}
.os-status-label{font-size:13px;color:var(--text3)}

/* CONTENT PLACEHOLDER */
.project-placeholder{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:32px;min-height:300px;
  display:flex;align-items:center;justify-content:center;
}
.project-placeholder .inner{text-align:center}
.project-placeholder .inner .ico{font-size:48px;margin-bottom:16px}
.project-placeholder .inner h3{font-size:18px;font-weight:500;margin-bottom:8px;color:var(--text2)}
.project-placeholder .inner p{color:var(--text3);font-size:14px;max-width:400px;line-height:1.6}

/* EVENTS */
.events-container{display:flex;flex-direction:column;gap:20px;margin-top:8px}
.event-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .3s}
.event-card:hover{border-color:var(--border-active)}
.event-card.done{opacity:.3;display:none}
.event-card .ev-img{width:100%;height:200px;object-fit:cover;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:64px;color:var(--text3);border-bottom:1px solid var(--border)}
.event-card .ev-body{padding:24px}
.event-card .ev-meta{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.event-card .ev-date{font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--text2);background:var(--bg2);padding:4px 12px;border-radius:6px;border:1px solid var(--border)}
.event-card .ev-type{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;padding:4px 12px;border-radius:12px}
.ev-type.Meteor{background:rgba(99,102,241,0.15);color:#818cf8}
.ev-type.Eclipse{background:rgba(239,68,68,0.15);color:#f87171}
.ev-type.Planetary{background:rgba(34,197,94,0.15);color:#4ade80}
.ev-type.Seasonal{background:rgba(234,179,8,0.15);color:#facc15}
.ev-type.Comet{background:rgba(168,85,247,0.15);color:#c084fc}
.event-card .ev-title{font-size:18px;font-weight:600;margin-bottom:8px}
.event-card .ev-desc{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:16px}
.event-card .ev-observe{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:16px}
.event-card .ev-observe-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-bottom:6px}
.event-card .ev-observe-text{font-size:13px;color:var(--text2);line-height:1.5}
.event-card .took-part{padding:10px 24px;background:transparent;border:1px solid var(--green);border-radius:var(--radius-sm);color:var(--green);font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .2s}
.event-card .took-part:hover{background:rgba(34,197,94,0.1);transform:translateY(-1px)}

.events-empty{text-align:center;padding:64px 32px;color:var(--text3)}
.events-empty .ico{font-size:64px;margin-bottom:16px}
.events-empty h3{font-size:18px;color:var(--text2);margin-bottom:8px}

/* FRANKFURT EVENTS LIST */
.fe-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.fe-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px 20px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:space-between}
.fe-item:hover{background:var(--card-hover);border-color:var(--border-active);transform:translateX(4px)}
.fe-item .fe-title{font-size:15px;font-weight:500}
.fe-item .fe-right{display:flex;align-items:center;gap:10px}
.fe-category{font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;background:rgba(99,102,241,0.12);color:#818cf8;white-space:nowrap}
.fe-date{font-size:13px;font-family:'JetBrains Mono',monospace;color:var(--text2);background:var(--bg2);padding:4px 12px;border-radius:6px;border:1px solid var(--border);white-space:nowrap}

/* HESSEN */
.hessen-controls{display:flex;align-items:center;gap:20px;padding:16px 20px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;flex-wrap:wrap}
.hessen-slider-group{display:flex;align-items:center;gap:12px;flex:1;min-width:250px}
.hessen-slider-label{font-size:13px;color:var(--text2);white-space:nowrap;font-weight:500}
.hessen-slider{-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:var(--border);outline:none;flex:1}
.hessen-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 0 8px var(--accent-glow)}
.hessen-slider-val{font-size:15px;color:var(--accent);font-weight:600;min-width:45px;text-align:right;font-family:'JetBrains Mono',monospace}
.hessen-count{font-size:12px;color:var(--text3);white-space:nowrap}
.hessen-item{display:flex;flex-direction:column;padding:16px 20px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;cursor:pointer;transition:all .2s}
.hessen-item:hover{background:var(--card-hover);border-color:var(--border-active);transform:translateX(4px)}
.hessen-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hessen-title{font-size:15px;font-weight:600;line-height:1.3}
.hessen-distance{font-size:12px;color:var(--accent);white-space:nowrap;font-family:'JetBrains Mono',monospace;background:rgba(99,102,241,0.1);padding:2px 8px;border-radius:4px;flex-shrink:0}
.hessen-bottom{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.hessen-city{font-size:12px;color:var(--text2)}
.hessen-cat{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--accent-glow);color:var(--accent)}
.hessen-date{font-size:11px;padding:2px 8px;border-radius:4px;background:rgba(34,197,94,0.1);color:var(--green)}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);z-index:999;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,0.5)}
@keyframes modalIn{from{opacity:0;transform:translateY(20px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{padding:24px 28px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-header h2{font-size:20px;font-weight:600;line-height:1.3;flex:1}
.modal-close{background:var(--card);border:1px solid var(--border);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);font-size:18px;transition:all .15s;flex-shrink:0}
.modal-close:hover{background:rgba(239,68,68,0.1);border-color:var(--red);color:var(--red)}
.modal-meta{display:flex;flex-wrap:wrap;gap:8px;padding:0 28px;margin-top:12px}
.meta-tag{font-size:12px;padding:5px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--text2);display:flex;align-items:center;gap:5px}
.modal-body{padding:20px 28px 28px}
.detail-section{margin-bottom:18px}
.detail-section:last-child{margin-bottom:0}
.detail-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-bottom:6px}
.detail-text{font-size:14px;color:var(--text2);line-height:1.6}
.modal-img{width:100%;max-height:260px;object-fit:cover;border-radius:10px;background:var(--bg);margin-bottom:18px;display:block}
.modal-img-placeholder{width:100%;height:160px;border-radius:10px;background:linear-gradient(135deg,var(--card),var(--bg2));border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:48px;color:var(--text3);margin-bottom:18px}
.maps-link{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);border-radius:var(--radius-sm);color:var(--green);text-decoration:none;font-size:13px;font-weight:500;margin-top:8px;transition:all .2s}
.maps-link:hover{background:rgba(34,197,94,0.2);border-color:var(--green)}

/* MOVIES */
.movies-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:8px}
.movie-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .3s}
.movie-card:hover{border-color:var(--border-active);transform:translateY(-4px);box-shadow:0 12px 40px rgba(0,0,0,0.3)}
.movie-card .mc-img{width:100%;height:300px;object-fit:cover;background:linear-gradient(135deg,var(--bg2),#1a1a2e);display:flex;align-items:center;justify-content:center;font-size:64px;color:var(--text3);border-bottom:1px solid var(--border)}
.movie-card .mc-body{padding:20px;display:flex;flex-direction:column;gap:8px}
.movie-card .mc-title{font-size:16px;font-weight:600;line-height:1.3}
.movie-card .mc-meta{font-size:12px;color:var(--text2);display:flex;gap:12px;flex-wrap:wrap}
.movie-card .mc-imdb{font-size:12px;color:var(--yellow);font-family:'JetBrains Mono',monospace}
.movie-card .mc-desc{font-size:13px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.movie-card .mc-btn{width:100%;padding:10px;background:var(--accent);border:none;border-radius:var(--radius-sm);color:#fff;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;margin-top:4px}
.movie-card .mc-btn:hover{background:#5558e6;transform:translateY(-1px)}

/* STARS */
.star-row{display:flex;gap:4px;padding:12px 0}
.star{font-size:28px;cursor:pointer;color:var(--text3);transition:color .15s,transform .1s;user-select:none}
.star:hover{transform:scale(1.2)}
.star.active,.star.hover{color:var(--yellow)}
.star-label{font-size:13px;color:var(--text2);margin-left:8px;font-weight:500}

/* MOVIE MODAL */
.movie-modal-poster{width:100%;max-height:400px;object-fit:contain;border-radius:10px;background:var(--bg);margin-bottom:18px}
.movie-modal-info{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.movie-modal-info .mm-tag{font-size:12px;padding:4px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);color:var(--text2)}
.movie-modal-info .mm-tag.imdb{color:var(--yellow);border-color:rgba(234,179,8,0.3);background:rgba(234,179,8,0.08)}
.movie-modal-actions{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.movie-choose-btn{padding:12px 24px;background:var(--green);border:none;border-radius:var(--radius-sm);color:#fff;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s}
.movie-choose-btn:hover{background:#16a34a;transform:translateY(-1px)}
.movie-trailer-btn{padding:12px 24px;background:transparent;border:1px solid var(--accent);border-radius:var(--radius-sm);color:var(--accent);font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.movie-trailer-btn:hover{background:var(--accent-glow);transform:translateY(-1px)}

/* HISTORY */
.movies-history{margin-top:32px}
.movies-history h3{font-size:16px;font-weight:600;margin-bottom:12px;color:var(--text2)}
.history-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;transition:all .15s}
.history-item:hover{border-color:var(--border-active)}
.history-item .hi-title{font-size:14px;font-weight:500}
.history-item .hi-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--text2)}
.history-item .hi-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text3)}
.history-empty{text-align:center;padding:32px;color:var(--text3);font-size:14px}
.movie-empty-state{text-align:center;padding:64px 32px;color:var(--text3)}
.movie-empty-state .mico{font-size:64px;margin-bottom:16px}
.movie-empty-state h3{font-size:18px;color:var(--text2);margin-bottom:8px}

/* MUSIC TAB */
.music-hero{background:linear-gradient(135deg,rgba(99,102,241,0.12),rgba(34,197,94,0.08));border:1px solid rgba(99,102,241,0.2);border-radius:16px;padding:32px;margin-bottom:24px;position:relative;overflow:hidden}
.music-hero::before{content:'🎵';position:absolute;right:24px;bottom:-16px;font-size:120px;opacity:0.1}
.music-hero-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:8px}
.music-hero-title{font-size:28px;font-weight:700;margin-bottom:4px;background:linear-gradient(135deg,#fff,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.music-hero-artist{font-size:16px;color:var(--text2);margin-bottom:4px}
.music-hero-genre{font-size:13px;color:var(--text3);margin-bottom:12px}
.music-hero-why{font-size:13px;color:var(--text2);font-style:italic;padding:8px 16px;background:rgba(255,255,255,0.04);border-radius:8px;border-left:3px solid var(--accent);margin-bottom:16px}
.music-hero .star-row{justify-content:flex-start;padding:8px 0}
.music-hero .star{font-size:32px}
.music-hero .star-label{font-size:14px}
.music-play-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);border-radius:20px;color:var(--green);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .2s;text-decoration:none;margin-top:6px}
.music-play-btn:hover{background:rgba(34,197,94,0.2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(34,197,94,0.15)}

<body>

<!-- ═══ LOGIN ═══ -->
<div id="login-overlay">

    <form id="login-form" onsubmit="return doLogin()">
      <div class="login-group">
        <label>Username</label>
        <input type="text" id="log-user" value="m4oz" placeholder="username" autofocus>
      </div>
      <div class="login-group">
        <label>Password</label>

<!-- ═══ DASHBOARD ═══ -->
<div id="dashboard">

  <div class="topbar">

    </div>

  </div>

        <div style="text-align:center;padding:48px;color:var(--text3)"><div style="font-size:32px;margin-bottom:12px">🔄</div><p>Loading highlights...</p></div>

<script>
// ════════════════════════════════════════════════════════
// CREDENTIALS — stored as character codes, NO base64/atob/btoa
// ════════════════════════════════════════════════════════

const PASSWORDS = {
  'm4oz':    [75,97,108,97,102,105,111,114,48,49],    // Kalafior01
  'sweetie': [77,97,106,97,50,48,50,54,33]             // Maja2026!
};

// Google OAuth — client ID + allowed emails
const GOOGLE_CLIENT_ID = '947168928592-ikuna9qelftj2fq7hh9b0opcq9r164m3.apps.googleusercontent.com';
const ALLOWED_EMAILS = ['m4oz.paul@gmail.com'];  // add more emails here

const SESSION_KEY = 'portal_auth';
const BUST = '_=' + Date.now();
const EVENTS_URL = 'events.json?' + BUST;
const CONFIG_URL = 'config.json?' + BUST;
const FRANKFURT_URL = 'frankfurt_events.json?' + BUST;
const HESSEN_URL = 'hessen_events.json?' + BUST;

// ════════════════════════════════════════════════════════
// LOGIN — pure string comparison
// ════════════════════════════════════════════════════════

function doLogin() {
  const user = document.getElementById('log-user').value.trim();
  const pass = document.getElementById('log-pass').value;
  const err = document.getElementById('log-error');

  // Reconstruct password from char codes
  const codes = PASSWORDS[user];
  if (!codes) { err.style.display = 'block'; return false; }

  const expected = String.fromCharCode.apply(null, codes);
  if (pass !== expected) { err.style.display = 'block'; return false; }

  // SUCCESS
  err.style.display = 'none';
  sessionStorage.setItem(SESSION_KEY, 'true');
  showDashboard();
  return false;
}

// ════════════════════════════════════════════════════════
// DASHBOARD
// ════════════════════════════════════════════════════════

async function showDashboard() {
  document.getElementById('login-overlay').classList.add('hidden');
  document.getElementById('dashboard').classList.add('active');

  let config;
  try {
    const r = await fetch(CONFIG_URL);
    config = await r.json();
  } catch(_) {
    config = { kredyt: 0, tokens: 0, model: '—', projects: [], last_updated: '—' };
  }

  document.getElementById('m-credit').textContent = '$' + (config.kredyt ?? 0);
  document.getElementById('m-tokens').textContent = (config.tokens ?? 0).toLocaleString();
  document.getElementById('m-model').textContent = config.model || '—';
  document.getElementById('page-footer').textContent = 'Last updated: ' + (config.last_updated || '—');

  buildTabs(config);
  buildOverview(config);
}

function buildTabs(config) {
  const bar = document.getElementById('tabbar');
  const dynamic = document.getElementById('dynamic-content');
  dynamic.innerHTML = '';

  (config.projects || []).forEach(p => {
    const id = 'project-' + slug(p.name);
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.dataset.tab = id;
    btn.onclick = () => switchTab(id);
    btn.innerHTML = '<span class="dot ' + (p.status || 'active') + '"></span> ' + escHtml(p.name);
    bar.appendChild(btn);

    const div = document.createElement('div');
    div.className = 'tab-content';
    div.id = 'tab-' + id;
    div.innerHTML = buildProject(p);
    dynamic.appendChild(div);
  });
}

function buildProject(p) {
  const id = 'project-' + slug(p.name);
  const header = '<div class="project-tab-header"><h2 style="font-size:22px;font-weight:600;margin-bottom:4px">📁 ' + escHtml(p.name) + '</h2><p style="color:var(--text2);font-size:14px">' + escHtml(p.desc || p.description || '') + '</p></div>';

  if (p.name === 'natural events') {
    return header + '<div class="events-container" id="ev-' + id + '"><div class="events-empty"><div class="ico">🔭</div><p>Loading celestial events...</p></div></div>';
  }
  if (p.display === 'hessen_events' || p.name === 'Hessen Events') {
    return header +
      '<div class="hessen-controls">' +
        '<div class="hessen-slider-group"><span class="hessen-slider-label">📍 Distance from Frankfurt:</span>' +
        '<input type="range" class="hessen-slider" id="he-slider" min="0" max="300" value="300" step="5">' +
        '<span class="hessen-slider-val" id="he-slider-val">300 km</span></div>' +
        '<span class="hessen-count" id="he-count">Showing events</span>' +
      '</div>' +
      '<div class="fe-list" id="he-container"><div style="text-align:center;padding:64px;color:var(--text3)"><div style="font-size:48px;margin-bottom:16px">🌍</div><p>Loading Hessen events...</p></div></div>';
  }
  if (p.display === 'frankfurt_events' || p.name === 'Frankfurt Events') {
    return header +
      '<div class="fe-list" id="fe-container"><div style="text-align:center;padding:64px;color:var(--text3)"><div style="font-size:48px;margin-bottom:16px">🎪</div><p>Loading Frankfurt events...</p></div></div>';
  }
  if (p.display === 'movies' || p.name === 'Movies') {
    return header +
      '<div id="movies-suggestions" class="movies-grid"><div class="movie-empty-state"><div class="mico">🎬</div><h3>No suggestions yet</h3><p>New movie picks arrive every Tuesday, Thursday, and Saturday at 8 PM.</p></div></div>' +
      '<div class="movies-history" id="movies-history"><h3>📋 My Watch History</h3><div id="movies-history-list"><div class="history-empty">No movies chosen yet. Pick one from the suggestions above!</div></div></div>';
  }
  if (p.display === 'music' || p.name === 'Music') {
    return header +
      '<div id="music-today"><div class="music-empty-state"><div class="mico">🎵</div><h3>Loading today\'s song...</h3><p>Checking the daily recommendation.</p></div></div>' +
      '<div class="music-history" id="music-history"><h3>📋 My Song History</h3><div id="music-history-list"><div class="music-empty">No songs rated yet. Listen to today\'s pick and rate it!</div></div></div>';
  }
  if (p.display === 'trip_planner' || p.name === 'Trip Planner') {
    return header +

// OVERVIEW
// ════════════════════════════════════════════════════════

async function buildOverview(config) {
  const el = document.getElementById('overview-list');
  if (!el) return;
  const today = new Date().toISOString().split('T')[0];

  // Fetch all event data
  let celestial = [], frankfurt = [], hessen = [];
  try { const r = await fetch(EVENTS_URL); const d = await r.json(); celestial = (d.events||[]).filter(e => e.date >= today).sort((a,b)=>a.date.localeCompare(b.date)); } catch(_) {}
  try { const r = await fetch(FRANKFURT_URL); const d = await r.json(); frankfurt = (d.events||[]).filter(e => e.date >= today).sort((a,b)=>a.date.localeCompare(b.date)); } catch(_) {}
  try { const r = await fetch(HESSEN_URL); const d = await r.json(); hessen = (d.events||[]).filter(e => e.date >= today).sort((a,b)=>a.date.localeCompare(b.date)); } catch(_) {}

  el.innerHTML = '';
  (config.projects || []).forEach(p => {
    const id = 'project-' + slug(p.name);
    const tabId = 'tab-' + id;
    const sec = document.createElement('div');
    sec.className = 'os-card';
    sec.onclick = () => switchTab(id);

    const label = p.name === 'natural events' ? '🔭 Sky Events' :
                  p.name === 'Frankfurt Events' ? '🎪 Frankfurt Events' :
                  p.name === 'Hessen Events' ? '🌍 Hessen Events' :
                  p.name === 'Movies' ? '🎬 Movies' :
                  p.name === 'Music' ? '🎵 Music' :
                  p.name === 'Trip Planner' ? '🗺️ Trip Planner' : '📁 ' + p.name;

    // Celestial events
    if (p.name === 'natural events' && celestial.length > 0) {
      const e = celestial[0];
      sec.innerHTML = '<div class="os-head"><span class="os-label">' + label + '</span></div><div class="os-title">' + emoji(e.type) + ' ' + e.type + '</div><div class="os-meta"><span>📅 ' + e.date + '</span><span class="ev-type ' + typeClass(e.type) + '">' + e.type + '</span></div>';
    }
    // Hessen events
    else if ((p.name === 'Hessen Events' || p.display === 'hessen_events') && hessen.length > 0) {
      const e = hessen[0];
      sec.innerHTML = '<div class="os-head"><span class="os-label">' + label + '</span></div><div class="os-title">' + catEmoji(e.category) + ' ' + escHtml(e.title) + '</div><div class="os-meta"><span>📅 ' + fmtDate(e.date) + '</span><span>📍 ' + (e.distance_from_frankfurt_km || 0) + ' km</span></div>';
    }
    // Frankfurt events
    else if ((p.name === 'Frankfurt Events' || p.display === 'frankfurt_events') && frankfurt.length > 0) {
      const e = frankfurt[0];
      sec.innerHTML = '<div class="os-head"><span class="os-label">' + label + '</span></div><div class="os-title">' + catEmoji(e.category) + ' ' + escHtml(e.title) + '</div><div class="os-meta"><span>📅 ' + fmtDate(e.date) + '</span><span>' + (e.category || 'Event') + '</span></div>';
    }
    // Default project card
    else {
      sec.innerHTML = '<div class="os-head"><span class="os-label">' + label + '</span></div><div class="os-title" style="font-size:15px;color:var(--text2);font-weight:500"><span class="dot ' + (p.status || 'active') + '"></span>' + escHtml(p.name) + '</div><div class="os-desc">' + escHtml(p.description || 'No description.') + '</div>';
    }

    el.appendChild(sec);
  });
}

// ════════════════════════════════════════════════════════
// TAB SWITCH
// ════════════════════════════════════════════════════════

function switchTab(tabId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  const btn = document.querySelector('.tab[data-tab="' + tabId + '"]');
  if (btn) btn.classList.add('active');
  const content = document.getElementById('tab-' + tabId);
  if (content) content.classList.add('active');

  // Lazy load events on tab switch — use slugified IDs
  if (tabId === 'project-natural-events') loadCelestial();
  if (tabId === 'project-frankfurt-events') loadFrankfurt();
  if (tabId === 'project-hessen-events') loadHessen();
  if (tabId === 'project-movies') loadMovies();
  if (tabId === 'project-music') loadMusic();
  if (tabId === 'project-trip-planner') loadTrips();
}

// ════════════════════════════════════════════════════════
// CELESTIAL EVENTS
// ════════════════════════════════════════════════════════

const TP_KEY = 'portal_took_part';

function getTookPart() { try { return JSON.parse(localStorage.getItem(TP_KEY) || '[]'); } catch { return []; } }
function markTook(id) { const a = getTookPart(); if (!a.includes(id)) { a.push(id); localStorage.setItem(TP_KEY, JSON.stringify(a)); } }

async function loadCelestial() {
  const container = document.getElementById('ev-project-natural-events');
  if (!container) return;
  try {
    const r = await fetch(EVENTS_URL);
    const d = await r.json();
    renderCelestial(container, d.events || []);
  } catch(_) {
    container.innerHTML = '<div class="events-empty"><div class="ico">🔭</div><h3>Could not load events</h3><p>Events data not yet available.</p></div>';
  }
}

function renderCelestial(container, events) {
  const took = getTookPart();
  const today = new Date().toISOString().split('T')[0];
  const up = events.filter(e => e.date >= today && !took.includes(e.date + '-' + (e.title||'')));
  if (up.length === 0) {
    container.innerHTML = '<div class="events-empty"><div class="ico">🌌</div><h3>No upcoming events</h3><p>All caught up!</p></div>';
    return;
  }
  up.sort((a,b) => a.date.localeCompare(b.date));
  container.innerHTML = up.map(e => {
    const eid = (e.date + '-' + (e.type||'')).replace(/[^a-zA-Z0-9-]/g,'_');
    return '<div class="event-card' + (took.includes(e.date + '-' + (e.type||'')) ? ' done' : '') + '">' +
      '<div class="ev-img">' + emoji(e.type) + '</div>' +
      '<div class="ev-body">' +
        '<div class="ev-meta"><span class="ev-date">' + e.date + '</span><span class="ev-type ' + typeClass(e.type) + '">' + e.type + '</span></div>' +
        '<div class="ev-title">' + e.type + ' — ' + (e.description||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().substring(0,120) + '…</div>' +
        '<div class="ev-desc">' + (e.description||'') + '</div>' +
         '<div class="ev-observe"><div class="ev-observe-label">🔭 How to Observe</div><div class="ev-observe-text">' + escHtml(e.how_to_observe || 'Check local sky conditions.') + '</div></div>' +
         '<button class="took-part" onclick="handleTook(event,\'' + eid + '\',\'' + (e.date + '-' + (e.type||'')).replace(/'/g,"\\'") + '\')">✅ I Took Part!</button>' +
      '</div></div>';
  }).join('');
}

function handleTook(ev, elId, eventId) {
  ev.target.closest('.event-card').classList.add('done');
  ev.target.closest('.event-card').style.display = 'none';
  markTook(eventId);
}

// HESSEN EVENTS
// ════════════════════════════════════════════════════════

async function loadHessen() {
  const container = document.getElementById('he-container');
  if (!container) return;
  try {
    const r = await fetch(HESSEN_URL);
    const d = await r.json();
    const ev = d.events || [];
    window.__he = ev;
    setupHessenSlider(ev);
  } catch(_) {
    container.innerHTML = '<div class="events-empty"><div class="ico">🌍</div><h3>Could not load events</h3><p>Events data not yet available.</p></div>';
  }
}

function setupHessenSlider(allEv) {
  const container = document.getElementById('he-container');
  const slider = document.getElementById('he-slider');
  const valDisplay = document.getElementById('he-slider-val');
  if (!slider || !container) return;
  valDisplay.textContent = slider.value + ' km';
  const update = () => {
    valDisplay.textContent = slider.value + ' km';
    renderHessen(container, allEv, parseInt(slider.value));
  };
  slider.addEventListener('input', update);
  update(); // initial render
}

function renderHessen(container, events, maxDist) {
  const today = new Date().toISOString().split('T')[0];
  let filtered = events.filter(e => e.date >= today);
  if (typeof maxDist === 'number') filtered = filtered.filter(e => (e.distance_from_frankfurt_km || 0) <= maxDist);
  filtered.sort((a,b) => a.date.localeCompare(b.date));
  const count = document.getElementById('he-count');
  if (count) count.textContent = filtered.length + (filtered.length === 1 ? ' event found' : ' events found');

  window.__heFiltered = filtered;
  if (filtered.length === 0) {
    container.innerHTML = '<div class="events-empty"><div class="ico">🌍</div><h3>No events within range</h3><p>Try increasing the distance slider.</p></div>';
    return;
  }

  container.innerHTML = filtered.map((e,i) => {
    const d = e.distance_from_frankfurt_km || 0;
    return '<div class="hessen-item" data-idx="' + i + '">' +
      '<div class="hessen-top"><span class="hessen-title">' + catEmoji(e.category) + ' ' + escHtml(e.title) + '</span><span class="hessen-distance">📍 ' + (d < 1 ? '< 1' : d.toFixed(0)) + ' km</span></div>' +
      '<div class="hessen-bottom"><span class="hessen-city">🏙️ ' + (e.city || '') + '</span><span class="hessen-cat">' + (e.category || 'Event') + '</span><span class="hessen-date">📅 ' + fmtDate(e.date) + '</span></div></div>';
  }).join('');

  if (!container._he) { container._he = true; container.addEventListener('click', function(e) { const el = e.target.closest('.hessen-item'); if (el) openModal(parseInt(el.dataset.idx), 'hessen'); }); }
}

// MODAL
// ════════════════════════════════════════════════════════

function openModal(idx, type) {
  const events = type === 'hessen' ? (window.__heFiltered || window.__he) : window.__fe;
  if (!events || !events[idx]) return;
  const e = events[idx];
  const overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-title').textContent = (catEmoji(e.category) || '') + ' ' + (e.title || '');

  const meta = document.getElementById('modal-meta');
  meta.innerHTML = '<span class="meta-tag"><span>📅</span> ' + fmtDate(e.date) + '</span>' +
    (e.time ? '<span class="meta-tag"><span>⏰</span> ' + e.time + '</span>' : '') +
    '<span class="meta-tag"><span>🏷️</span> ' + (e.category || 'Event') + '</span>' +
    (e.city ? '<span class="meta-tag"><span>🏙️</span> ' + e.city + '</span>' : '') +
    (e.distance_from_frankfurt_km !== undefined ? '<span class="meta-tag"><span>📍</span> ' + e.distance_from_frankfurt_km.toFixed(0) + ' km</span>' : '');

  const body = document.getElementById('modal-body');
  let html = '';
  if (e.image_url) html += '<img class="modal-img" src="' + e.image_url + '" alt="' + escHtml(e.title) + '" onerror="this.style.display=\'none\'">';
  else html += '<div class="modal-img-placeholder">' + (catEmoji(e.category) || '📌') + '</div>';

  html += '<div class="detail-section"><div class="detail-label">📖 Description</div><div class="detail-text">' + (e.description || 'No description.') + '</div></div>';
  if (e.location) html += '<div class="detail-section"><div class="detail-label">📍 Location</div><div class="detail-text">' + e.location + '</div></div>';
  html += '<div class="detail-section"><div class="detail-label">💰 Cost</div><div class="detail-text">' + (e.cost_per_person || 'Free') + '</div></div>';

  // Distance section for Hessen
  if (type === 'hessen' && e.distance_from_frankfurt_km !== undefined) {
    const d = e.distance_from_frankfurt_km;
    html += '<div class="detail-section"><div class="detail-label">📍 Distance from Frankfurt</div><div class="detail-text">' + (d < 1 ? '< 1 km' : d.toFixed(0) + ' km') + '</div></div>';
  }

  // Website
  if (e.website) html += '<div class="detail-section"><div class="detail-label">🌐 Official Website</div><div class="detail-text"><a href="' + e.website + '" target="_blank" rel="noopener" class="maps-link">🌐 Visit Event Website</a></div></div>';
  // Maps link for Hessen
  if (type === 'hessen' && e.google_maps_link) html += '<div class="detail-section"><a href="' + e.google_maps_link + '" target="_blank" rel="noopener" class="maps-link">🗺️ Open in Google Maps</a></div>';

  body.innerHTML = html;
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  const overlay = document.getElementById('modal-overlay');
  if (overlay) { overlay.classList.remove('active'); document.body.style.overflow = ''; }
}
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

// ════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════

function emoji(t) {
  const m = {'Meteor Shower':'☄️','Meteor':'☄️','Eclipse':'🌑','Planetary Event':'🪐','Planet':'🪐','Seasonal Event':'🌞','Comet':'☄️','Solstice':'🌞','Flare':'🔥','Asteroid':'☄️','Sun':'🌞','Moon':'🌙','Mars':'🔴','Venus':'🌟','Jupiter':'🪐','Saturn':'🪐','Mercury':'☿️'};
  return m[t] || '🔭';
}
function typeClass(t) {
  if (t.includes('Meteor')) return 'Meteor'; if (t.includes('Eclipse')) return 'Eclipse'; if (t.includes('Planet')) return 'Planetary'; if (t.includes('Seasonal')||t.includes('Solstice')) return 'Seasonal'; if (t.includes('Comet')) return 'Comet'; return 'Planetary';
}
function catEmoji(c) {
  const m = {'Music & Opera':'🎵','Festival & Culture':'🎉','Literature & Arts':'📚','Art & Exhibitions':'🖼️','Food & Drink':'🍽️','Convention & Pop Culture':'🎮','Film & Cinema':'🎬','Seasonal & Markets':'🎄','Markets & Shopping':'🛍️','Sports':'⚽','Nightlife & Social':'🌙','Family & Education':'👨‍👩‍👧‍👦'};
  return m[c] || '🎪';
}
function fmtDate(s) { const d = new Date(s + 'T00:00:00'); return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'}); }
function escHtml(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function slug(s) { return (s + '').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

const MOVIES_URL = 'movies.json?_=' + Date.now();
const MUSIC_URL = 'music.json?_=' + Date.now();
const TRIPS_URL = 'trips.json?_=' + Date.now();

let _currentMovie = null; // currently open movie in modal

async function loadMovies() {
  try {
    const r = await fetch(MOVIES_URL);
    const d = await r.json();
    renderSuggestions(d.suggestions || []);
    renderHistory(getMovieHistory());
  } catch(_) {}
}

function renderSuggestions(suggestions) {
  const container = document.getElementById('movies-suggestions');
  if (!container) return;
  if (!suggestions || suggestions.length === 0) {
    container.innerHTML = '<div class="movie-empty-state"><div class="mico">🎬</div><h3>No suggestions yet</h3><p>New movie picks arrive every Tuesday, Thursday, and Saturday at 8 PM.</p></div>';
    return;
  }
  container.innerHTML = suggestions.map((m, i) =>
    '<div class="movie-card" onclick="openMovieModal(' + i + ')">' +
      '<div class="mc-img">' + (m.poster_url ? '<img src="' + m.poster_url + '" alt="' + escHtml(m.title) + '" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\'">' : '🎬') + '</div>' +
      '<div class="mc-body">' +
        '<div class="mc-title">' + escHtml(m.title) + '</div>' +
        '<div class="mc-meta"><span>' + (m.year || '') + '</span><span>' + escHtml(m.genre || '') + '</span></div>' +
        '<div class="mc-imdb">★ ' + (m.imdb_rating || '?') + '/10</div>' +
        '<div class="mc-desc">' + escHtml((m.description||'').substring(0,200)) + '</div>' +
        '<button class="mc-btn" onclick="event.stopPropagation();openMovieModal(' + i + ')">🎬 View & Choose</button>' +
      '</div></div>'
  ).join('');
  window.__movieSuggestions = suggestions;
}

function openMovieModal(index) {
  const movies = window.__movieSuggestions;
  if (!movies || !movies[index]) return;
  const m = movies[index];
  _currentMovie = m;

  const overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-title').textContent = '🎬 ' + m.title;

  const meta = document.getElementById('modal-meta');
  meta.innerHTML = '<span class="mm-tag">📅 ' + (m.year || '') + '</span><span class="mm-tag">🏷️ ' + escHtml(m.genre || '') + '</span><span class="mm-tag imdb">★ IMDb ' + (m.imdb_rating || '?') + '</span>';

  // Check if already rated
  const stored = getMovieHistory();
  const existing = stored.find(h => h.title === m.title);
  const myRating = existing ? existing.my_rating : 0;

  const body = document.getElementById('modal-body');
  body.innerHTML =
    (m.poster_url ? '<img class="movie-modal-poster" src="' + m.poster_url + '" alt="' + escHtml(m.title) + '" onerror="this.style.display=\'none\'">' :
     '<div class="modal-img-placeholder" style="height:300px">🎬</div>') +
    '<div class="detail-section"><div class="detail-label">📖 Story</div><div class="detail-text">' + escHtml(m.description || '') + '</div></div>' +
    (m.director ? '<div class="detail-section"><div class="detail-label">🎥 Director</div><div class="detail-text">' + escHtml(m.director) + '</div></div>' : '') +
    '<div class="detail-section"><div class="detail-label">⭐ Rate This Movie</div><div class="star-row" id="movie-stars">' + renderStars(myRating) + '</div></div>' +
    '<div class="movie-modal-actions">' +
      '<button class="movie-choose-btn" onclick="chooseMovie()">✅ I Choose This Movie</button>' +
      (m.trailer_url ? '<a href="' + m.trailer_url + '" target="_blank" rel="noopener" class="movie-trailer-btn">▶ Watch Trailer</a>' : '<span class="movie-trailer-btn" style="opacity:0.5;cursor:default;border-color:var(--text3);color:var(--text3)">▶ No Trailer Available</span>') +
    '</div>';

  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';

  // Set up star hover/click after rendering
  setTimeout(setupStars, 50);
}

function renderStars(rating) {
  let html = '';
  for (let i = 1; i <= 10; i++) {
    html += '<span class="star ' + (i <= rating ? 'active' : '') + '" data-val="' + i + '">★</span>';
  }
  html += '<span class="star-label" id="star-label">' + (rating > 0 ? rating + '/10' : 'Click to rate') + '</span>';
  return html;
}

function setupStars() {
  const row = document.getElementById('movie-stars');
  if (!row) return;
  const stars = row.querySelectorAll('.star');
  const label = document.getElementById('star-label');

  stars.forEach(s => {
    s.addEventListener('mouseenter', function() {
      const val = parseInt(this.dataset.val);
      stars.forEach(st => st.classList.toggle('hover', parseInt(st.dataset.val) <= val));
    });
    s.addEventListener('mouseleave', function() {
      stars.forEach(st => st.classList.remove('hover'));
    });
    s.addEventListener('click', function() {
      const val = parseInt(this.dataset.val);
      stars.forEach(st => st.classList.toggle('active', parseInt(st.dataset.val) <= val));
      if (label) label.textContent = val + '/10';
      // Save rating to history
      if (_currentMovie) saveRating(_currentMovie.title, val);
    });
  });
}

function saveRating(title, rating) {
  let history = getMovieHistory();
  const idx = history.findIndex(h => h.title === title);
  if (idx >= 0) {
    history[idx].my_rating = rating;
  } else {
    history.push({ title: title, my_rating: rating, chosen_date: '' });
  }
  localStorage.setItem('movie_history', JSON.stringify(history));
}

function getMovieHistory() {
  try { return JSON.parse(localStorage.getItem('movie_history') || '[]'); }
  catch { return []; }
}

async function chooseMovie() {
  if (!_currentMovie) return;
  const m = _currentMovie;
  const today = new Date().toISOString().split('T')[0];

  let history = getMovieHistory();
  const idx = history.findIndex(h => h.title === m.title);
  if (idx < 0) {
    history.push({ title: m.title, year: m.year, genre: m.genre, my_rating: 0, chosen_date: today, imdb_rating: m.imdb_rating });
  } else {
    history[idx].chosen_date = today;
  }
  localStorage.setItem('movie_history', JSON.stringify(history));

  // Close modal
  closeModal();
  renderHistory(history);
  // Show success
  const container = document.getElementById('movies-suggestions');
  if (container) {
    const flash = document.createElement('div');
    flash.style.cssText = 'position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:16px 32px;border-radius:12px;font-weight:600;z-index:2000;animation:fadeIn .3s;box-shadow:0 8px 32px rgba(0,0,0,0.4)';
    flash.textContent = '✅ "' + m.title + '" added to your watch history!';
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 3000);
  }
}

function renderHistory(history) {
  const container = document.getElementById('movies-history-list');
  if (!container) return;
  if (!history || history.length === 0) {
    container.innerHTML = '<div class="history-empty">No movies chosen yet. Pick one from the suggestions above!</div>';
    return;
  }
  container.innerHTML = history.slice().reverse().map(h =>
    '<div class="history-item">' +
      '<span class="hi-title">🎬 ' + escHtml(h.title) + (h.year ? ' (' + h.year + ')' : '') + '</span>' +
      '<div class="hi-meta">' +
        (h.my_rating > 0 ? '<span>' + '★'.repeat(Math.min(h.my_rating,10)) + ' ' + h.my_rating + '/10</span>' : '<span style="color:var(--text3)">Not rated</span>') +
        (h.chosen_date ? '<span class="hi-date">' + h.chosen_date + '</span>' : '') +
      '</div></div>'
  ).join('');
}

const MUSIC_KEY = 'music_history';

function getMusicHistory() {

}

function saveMusicRating(title, artist, rating) {

  const idx = history.findIndex(h => h.title === title && h.artist === artist);
  if (idx >= 0) {
    history[idx].my_rating = rating;

async function loadMusic() {
  try {
    const r = await fetch(MUSIC_URL);
    const d = await r.json();
    renderMusicToday(d.todays_pick);
    renderMusicHistory();
  } catch(_) {
    const container = document.getElementById('music-today');
    if (container) container.innerHTML = '<div class="music-empty-state"><div class="mico">🎵</div><h3>Could not load music data</h3><p>Music recommendations not yet available.</p></div>';
  }
}

function renderMusicToday(pick) {
  const container = document.getElementById('music-today');
  if (!container) return;
  if (!pick || !pick.title) {
    container.innerHTML = '<div class="music-empty-state"><div class="mico">🎵</div><h3>No pick today</h3><p>Check back tomorrow for a new song recommendation!</p></div>';
    return;
  }

  // Check if already rated
  const history = getMusicHistory();
  const existing = history.find(h => h.title === pick.title && h.artist === pick.artist);
  const myRating = existing ? existing.my_rating : 0;

  container.innerHTML =
    '<div class="music-hero">' +
      '<div class="music-hero-label">🎵 Song of the Day — ' + pick.picked_date + '</div>' +
      '<div class="music-hero-title">' + escHtml(pick.title) + '</div>' +
      '<div class="music-hero-artist">' + escHtml(pick.artist) + '</div>' +
      '<div class="music-hero-genre">' + (pick.genre ? escHtml(pick.genre) : '') + (pick.year ? ' · ' + pick.year : '') + '</div>' +
      '<a class="music-play-btn" href="https://www.youtube.com/results?search_query=' + encodeURIComponent(pick.title + ' ' + pick.artist) + '" target="_blank" rel="noopener">▶ Listen on YouTube</a>' +
      (pick.why ? '<div class="music-hero-why">💡 ' + escHtml(pick.why) + '</div>' : '') +
      '<div class="detail-section"><div class="detail-label">⭐ Rate This Song</div><div class="star-row" id="music-stars">' + renderMusicStars(myRating) + '</div></div>' +
    '</div>';

  // Set up star interaction
  setTimeout(setupMusicStars, 50);
}

function renderMusicStars(rating) {
  let html = '';
  for (let i = 1; i <= 10; i++) {
    html += '<span class="star ' + (i <= rating ? 'active' : '') + '" data-val="' + i + '">★</span>';
  }
  html += '<span class="star-label" id="music-star-label">' + (rating > 0 ? rating + '/10' : 'Click to rate') + '</span>';
  return html;
}

function setupMusicStars() {
  const row = document.getElementById('music-stars');
  if (!row) return;
  const stars = row.querySelectorAll('.star');
  const label = document.getElementById('music-star-label');

  stars.forEach(s => {
    s.addEventListener('mouseenter', function() {
      const val = parseInt(this.dataset.val);
      stars.forEach(st => st.classList.toggle('hover', parseInt(st.dataset.val) <= val));
    });
    s.addEventListener('mouseleave', function() {
      stars.forEach(st => st.classList.remove('hover'));
    });
    s.addEventListener('click', function() {
      const val = parseInt(this.dataset.val);
      stars.forEach(st => st.classList.toggle('active', parseInt(st.dataset.val) <= val));
      if (label) label.textContent = val + '/10';
      // Get current song from the hero
      const hero = document.querySelector('.music-hero');
      if (hero) {
        const titleEl = hero.querySelector('.music-hero-title');
        const artistEl = hero.querySelector('.music-hero-artist');
        if (titleEl && artistEl) {
          saveMusicRating(titleEl.textContent, artistEl.textContent, val);
        }
      }
    });
  });
}

function renderMusicHistory() {
  const container = document.getElementById('music-history-list');
  if (!container) return;
  const history = getMusicHistory();
  if (!history || history.length === 0) {
    container.innerHTML = '<div class="music-empty">No songs rated yet. Listen to today\'s pick and rate it!</div>';
    return;
  }
  container.innerHTML = history.slice().reverse().map(h =>
    '<div class="music-history-item">' +
      '<div>' +
        '<div class="mhi-title">🎵 ' + escHtml(h.title) + '</div>' +
        '<div class="mhi-artist">' + escHtml(h.artist || '') +
        ' <a class="music-play-btn-sm" href="https://www.youtube.com/results?search_query=' + encodeURIComponent(h.title + ' ' + (h.artist || '')) + '" target="_blank" rel="noopener">▶ Sample</a></div>' +
      '</div>' +
      '<div class="mhi-meta">' +
        (h.my_rating > 0 ? '<span class="mhi-rating">' + '★ '.repeat(Math.min(h.my_rating, 10)).trim() + ' ' + h.my_rating + '/10</span>' : '<span style="color:var(--text3);font-size:11px">Not rated</span>') +
        (h.date ? '<span class="mhi-date">' + h.date + '</span>' : '') +
      '</div></div>'
  ).join('');
}

const TP_REQ_KEY = 'trip_requests';

function getTripRequests() {
  try { return JSON.parse(localStorage.getItem(TP_REQ_KEY) || '[]'); }
  catch { return []; }
}

function saveTripRequest(req) {
  const requests = getTripRequests();
  requests.push(req);
  localStorage.setItem(TP_REQ_KEY, JSON.stringify(requests));
}

async function submitTrip() {
  try {
    const from = document.getElementById('tp-from');
    const to = document.getElementById('tp-to');
    const depart = document.getElementById('tp-depart');
    const ret = document.getElementById('tp-return');
    const people = document.getElementById('tp-people');
    const budget = document.getElementById('tp-budget');
    const notes = document.getElementById('tp-notes');

    if (!from || !to || !depart || !ret) {
      showFlash('⚠️ Form not fully loaded. Try switching tabs and back.', 'info');
      return;
    }

    if (!from.value.trim() || !to.value.trim() || !depart.value || !ret.value) {
      showFlash('✗ Please fill in departure, destination, and both dates!', 'info');
      return;
    }

    if (depart.value >= ret.value) {
      showFlash('✗ Return date must be after departure date!', 'info');
      return;
    }

    const req = {
      id: 'tp-' + Date.now(),
      from: from.value.trim(),
      to: to.value.trim(),
      departure_date: depart.value,
      return_date: ret.value,
      people: parseInt(people.value) || 1,
      budget: budget.value ? parseFloat(budget.value) : null,
      notes: notes.value.trim(),
      status: 'pending',
      submitted_at: new Date().toISOString(),
      expires_at: new Date(Date.now() + 14 * 24 * 60 * 60 * 1000).toISOString(),
    };

    saveTripRequest(req);
    from.value = ''; to.value = ''; depart.value = ''; ret.value = '';
    people.value = '1'; budget.value = ''; notes.value = '';

    // Try to send to local server for automated processing
    let serverOk = false;
    try {
      const r = await fetch('https://trip.bluebell-imc.com/api/trip', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(req),
      });
      if (r.ok) serverOk = true;
    } catch(_) {}

    if (serverOk) {
      showFlash('✅ Trip request sent! I\'ll start researching now.', 'success');
    } else {
      showFlash('✅ Trip saved! I\'ll check for it and start researching shortly.', 'success');
    }
    loadTrips();
  } catch(e) {
    showFlash('✗ Something went wrong: ' + e.message, 'info');
  }
}

async function loadTrips() {
  // Bind the Arrange button
  const btn = document.getElementById('tp-arrange-btn');
  if (btn) btn.onclick = submitTrip;

  try {
    const r = await fetch(TRIPS_URL);
    const d = await r.json();
    const serverTrips = d.trips || [];

    // Auto-clean localStorage: remove pending entries that now have completed trips
    // Match by route (from/to/dates) since browser IDs differ from server IDs
    const pending = getTripRequests();
    const completedRoutes = new Set(serverTrips.map(t => 
      (t.request.from + '|' + t.request.to + '|' + t.request.departure_date).toLowerCase()
    ));
    const cleaned = pending.filter(r => {
      if (r.status !== 'pending') return false;
      const route = (r.from + '|' + r.to + '|' + r.departure_date).toLowerCase();
      return !completedRoutes.has(route);
    });
    if (cleaned.length !== pending.length) {
      localStorage.setItem(TP_REQ_KEY, JSON.stringify(cleaned));
    }

    renderTripList(serverTrips);
  } catch(_) {
    // Still show pending requests
    renderTripList([]);
  }
}

function renderTripList(serverTrips) {
  const container = document.getElementById('tp-list-content');
  if (!container) return;

  // Merge pending requests from localStorage with server trips
  const pending = getTripRequests().filter(r => r.status === 'pending');
  const all = [...serverTrips];

  // Add pending requests to the top
  const pendingCards = pending.map(r => ({
    id: r.id,
    request: r,
    status: 'pending',
    type: 'pending'
  }));

  const items = [...pendingCards, ...all];

  if (items.length === 0) {
    container.innerHTML = '<div class="tp-empty-state"><div class="ico">🗺️</div><h3>No trips yet</h3><p>Fill in the form above and click Arrange My Trip to get started!</p></div>';
    return;
  }

  container.innerHTML = items.map(t => {
    if (t.type === 'pending') {
      const r = t.request;
      return '<div class="tp-card">' +
        '<div class="tp-card-header">' +
          '<div class="tp-card-title"><span class="from">' + escHtml(r.from) + '</span><span class="arrow">→</span>' + escHtml(r.to) + '</div>' +
          '<span class="tp-card-status pending">⏳ Pending</span>' +
        '</div>' +
        '<div class="tp-card-meta">' +
          '<span>📅 ' + r.departure_date + ' → ' + r.return_date + '</span>' +
          '<span>👥 ' + r.people + ' traveler' + (r.people > 1 ? 's' : '') + '</span>' +
          (r.budget ? '<span>💰 €' + r.budget + '</span>' : '<span>💰 No budget set</span>') +
          (r.notes ? '<span>📝 "' + escHtml(r.notes.substring(0,50)) + (r.notes.length > 50 ? '…' : '') + '"</span>' : '') +
        '</div>' +
      '</div>';
    }
    // Completed trip
    const tr = t;
    return '<div class="tp-card" onclick="openTripDetail(\'' + tr.id + '\')">' +
      '<div class="tp-card-header">' +
        '<div class="tp-card-title"><span class="from">' + escHtml(tr.request.from) + '</span><span class="arrow">→</span>' + escHtml(tr.request.to) + '</div>' +
        (tr.plan && tr.plan.grand_total ? '<span class="tp-card-price">€' + tr.plan.grand_total + '</span>' : '') +
      '</div>' +
      '<div class="tp-card-meta">' +
        '<span>📅 ' + tr.request.departure_date + ' → ' + tr.request.return_date + '</span>' +
        '<span>👥 ' + tr.request.people + ' traveler' + (tr.request.people > 1 ? 's' : '') + '</span>' +
        (tr.request.budget ? '<span>💰 Budget: €' + tr.request.budget + '</span>' : '') +
        '<span class="tp-card-status complete">✅ Complete</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

function openTripDetail(tripId) {
  // Fetch trips.json and find the trip
  fetch(TRIPS_URL).then(r => r.json()).then(d => {
    const trip = (d.trips || []).find(t => t.id === tripId);
    if (!trip) { showFlash('Trip not found!', 'info'); return; }
    renderTripDetail(trip);
  }).catch(() => showFlash('Could not load trip details', 'info'));
}

function renderTripDetail(trip) {
  const overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-title').textContent = '🗺️ ' + trip.request.from + ' → ' + trip.request.to;

  // Meta info
  const meta = document.getElementById('modal-meta');
  const dates = trip.request.departure_date + ' → ' + trip.request.return_date;
  const people = trip.request.people + ' traveler' + (trip.request.people > 1 ? 's' : '');
  meta.innerHTML = '<span class="mm-tag">📅 ' + dates + '</span><span class="mm-tag">👥 ' + people + '</span>' +
    (trip.request.budget ? '<span class="mm-tag" style="color:var(--yellow)">💰 €' + trip.request.budget + ' budget</span>' : '<span class="mm-tag" style="color:var(--text3)">💰 No budget set</span>');

  const plan = trip.plan;
  if (!plan) {
    document.getElementById('modal-body').innerHTML = '<div class="tp-empty">Trip plan data not available.</div>';
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
    return;
  }

  let html = '';

  // Trip summary
  html += '<div class="tp-detail-section"><h4>📋 Trip Summary</h4><p style="font-size:13px;color:var(--text2);line-height:1.6">' +
    escHtml(plan.summary || '') + '</p></div>';

  // 65/35 split
  if (plan.phase1 && plan.phase2) {
    html += '<div class="tp-detail-section"><h4>🎯 Trip Rhythm</h4>' +
      '<div style="display:flex;gap:12px;font-size:13px">' +
        '<span style="padding:6px 12px;background:rgba(99,102,241,0.15);border-radius:8px;color:var(--accent);font-weight:600">🔍 Explore: ' + plan.phase1.days + ' days (' + plan.phase1.percentage + '%)</span>' +
        '<span style="padding:6px 12px;background:rgba(34,197,94,0.15);border-radius:8px;color:var(--green);font-weight:600">🏖️ Relax: ' + plan.phase2.days + ' days (' + plan.phase2.percentage + '%)</span>' +
      '</div></div>';
  }

  // Stopovers
  if (plan.layovers && plan.layovers.length > 0) {
    html += '<div class="tp-detail-section"><h4>🔄 Stopovers & Layovers</h4>';
    plan.layovers.forEach(lo => {
      html += '<div class="tp-layover-card">' +
        '<div class="tp-layover-header">📍 ' + escHtml(lo.city) + ' — ' + lo.stop_date + (lo.duration ? ' (' + lo.duration + ')' : '') + '</div>' +
        '<div class="tp-layover-body">' +
          (lo.hotel ? '<p><strong>🏨 Stay:</strong> ' + escHtml(lo.hotel.name) + ' — €' + lo.hotel.cost + '</p>' : '') +
          (lo.activities ? lo.activities.map(a => '<p><span class="time">' + a.time + '</span> ' + escHtml(a.activity) + (a.cost ? ' (€' + a.cost + ')' : '') + '</p>').join('') : '') +
          '<p style="margin-top:4px"><strong>💰 Layover total:</strong> €' + lo.total_cost + '</p>' +
        '</div></div>';
    });
    html += '</div>';
  }

  // Flights
  if (plan.flights) {
    html += '<div class="tp-detail-section"><h4>✈️ Flights<span class="cost">€' + plan.flights.total + '</span></h4>';
    if (plan.flights.outbound) {
      const f = plan.flights.outbound;
      html += '<div class="tp-flight-card">' +
        '<div class="route">🛫 ' + escHtml(f.from) + ' → 🛬 ' + escHtml(f.to) +
        (f.stops > 0 ? ' <span class="stop-info">🔄 ' + f.stops + ' stop' + (f.stops > 1 ? 's' : '') + '</span>' : ' <span class="stop-info">✈️ Direct</span>') +
        '</div>' +
        '<div class="details">' + f.airline + ' · ' + f.departure + ' → ' + f.arrival + ' · ' + f.duration + '</div>' +
        '<div class="price">€' + f.price_person + '/person · €' + f.total + ' total</div>' +
        (f.booking_url ? '<a class="booking-link" href="' + f.booking_url + '" target="_blank" rel="noopener">🔗 Book on ' + (f.booking_url.includes('skyscanner') ? 'Skyscanner' : f.booking_url.includes('kayak') ? 'Kayak' : f.booking_url.includes('booking') ? 'Booking.com' : 'travel site') + '</a>' : '') +
      '</div>';
    }
    if (plan.flights.return) {
      const f = plan.flights.return;
      html += '<div class="tp-flight-card">' +
        '<div class="route">🛫 ' + escHtml(f.from) + ' → 🛬 ' + escHtml(f.to) +
        (f.stops > 0 ? ' <span class="stop-info">🔄 ' + f.stops + ' stop' + (f.stops > 1 ? 's' : '') + '</span>' : ' <span class="stop-info">✈️ Direct</span>') +
        '</div>' +
        '<div class="details">' + f.airline + ' · ' + f.departure + ' → ' + f.arrival + ' · ' + f.duration + '</div>' +
        '<div class="price">€' + f.price_person + '/person · €' + f.total + ' total</div>' +
        (f.booking_url ? '<a class="booking-link" href="' + f.booking_url + '" target="_blank" rel="noopener">🔗 Book on booking site</a>' : '') +
      '</div>';
    }
    html += '</div>';
  }

  // Accommodation
  if (plan.accommodations && plan.accommodations.length > 0) {
    html += '<div class="tp-detail-section"><h4>🏨 Accommodation<span class="cost">€' + plan.accommodations.reduce((s,a) => s + (a.total || 0), 0) + '</span></h4>';
    plan.accommodations.forEach(acc => {
      const tag = acc.type === 'private' ? '🏠 Private' : acc.type === 'hostel' ? '🛏️ Hostel' : '🏨 Hotel';
      html += '<div class="tp-stay-card">' +
        '<div class="name">' + escHtml(acc.name) + ' <span class="tag">' + tag + '</span></div>' +
        '<div class="details">⭐ ' + (acc.rating || 'N/A') + ' · ' + (acc.address || '') + '</div>' +
        '<div class="price">€' + acc.price_per_night + '/night · €' + acc.total + ' total</div>' +
        (acc.description ? '<div style="font-size:12px;color:var(--text2);margin-top:4px">' + escHtml(acc.description) + '</div>' : '') +
        (acc.booking_url ? '<a class="booking-link" href="' + acc.booking_url + '" target="_blank" rel="noopener">🔗 Book now</a>' : '') +
        (acc.alternatives && acc.alternatives.length > 0 ? renderAlternatives(acc.alternatives) : '') +
      '</div>';
    });
    html += '</div>';
  }

  // Daily itinerary
  if (plan.daily_itinerary && plan.daily_itinerary.length > 0) {
    html += '<div class="tp-detail-section"><h4>📅 Daily Itinerary</h4>';
    plan.daily_itinerary.forEach(day => {
      const phaseClass = day.phase === 'relax' ? 'relax' : 'explore';
      const phaseLabel = day.phase === 'relax' ? '🏖️ Relax' : '🔍 Explore';
      html += '<div class="tp-day-card">' +
        '<div class="tp-day-header">' +
          '<span class="day">Day ' + day.day + ' — ' + day.date + '</span>' +
          '<span class="phase ' + phaseClass + '">' + phaseLabel + '</span>' +
          (day.day_total ? '<span class="day-total">€' + day.day_total + '</span>' : '') +
        '</div>';
      if (day.activities) {
        day.activities.forEach(a => {
          const costClass = a.cost === 0 || a.cost === '0' ? 'free' : '';
          html += '<div class="tp-activity">' +
            '<span class="time">' + (a.time || '') + '</span>' +
            '<span class="desc">' + escHtml(a.activity) + (a.description ? '<br><span style="color:var(--text3);font-size:11px">' + escHtml(a.description) + '</span>' : '') + '</span>' +
            '<span class="acost ' + costClass + '">' + (a.cost === 0 || a.cost === '0' ? 'FREE' : '€' + a.cost) + '</span>' +
          '</div>';

      html += '</div>';
    });
    html += '</div>';
  }

  // Cost summary
  html += '<div class="tp-cost-summary">';
  html += '<h4 style="margin-bottom:12px;font-size:14px;font-weight:600">💰 Cost Breakdown</h4>';
  if (plan.flights && plan.flights.total) html += '<div class="tp-cost-row"><span class="label">✈️ Flights</span><span class="value">€' + plan.flights.total + '</span></div>';
  if (plan.accommodations) html += '<div class="tp-cost-row"><span class="label">🏨 Accommodation</span><span class="value">€' + plan.accommodations.reduce((s,a) => s + (a.total || 0), 0) + '</span></div>';
  if (plan.food_total) html += '<div class="tp-cost-row"><span class="label">🍽️ Food & Drink</span><span class="value">€' + plan.food_total + '</span></div>';
  if (plan.attractions_total) html += '<div class="tp-cost-row"><span class="label">🎟️ Attractions</span><span class="value">€' + plan.attractions_total + '</span></div>';
  if (plan.transport_local_total) html += '<div class="tp-cost-row"><span class="label">🚌 Local Transport</span><span class="value">€' + plan.transport_local_total + '</span></div>';
  if (plan.extras_total) html += '<div class="tp-cost-row"><span class="label">🎒 Extras</span><span class="value">€' + plan.extras_total + '</span></div>';

  // Divider
  const grandTotal = plan.grand_total || 0;
  const budget = trip.request.budget;
  const overBudget = budget && grandTotal > budget;
  html += '<div class="tp-cost-row total ' + (overBudget ? 'over-budget' : '') + '"><span class="label">💵 Grand Total</span><span class="value">€' + grandTotal + '</span></div>';
  if (budget) {
    const pct = Math.min(100, Math.round((grandTotal / budget) * 100));
    html += '<div class="tp-cost-row"><span class="label">💰 Budget</span><span class="value">€' + budget + '</span></div>';
    html += '<div class="tp-budget-bar"><div class="fill ' + (overBudget ? 'over' : '') + '" style="width:' + pct + '%"></div></div>';
    if (overBudget) {
      html += '<p style="font-size:12px;color:var(--red);margin-top:8px">⚠️ Over budget by €' + (grandTotal - budget) + '</p>';
    } else {
      html += '<p style="font-size:12px;color:var(--green);margin-top:8px">✅ Under budget by €' + (budget - grandTotal) + '</p>';
    }
  }
  html += '</div>';

  // Culture button
  if (plan.culture) {
    html += '<button class="tp-culture-btn" onclick="openCulture(\'' + encodeURIComponent(JSON.stringify(plan.culture)) + '\')">📚 Culture & History</button>';
  }

  document.getElementById('modal-body').innerHTML = html;
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function renderAlternatives(alts) {
  if (!alts || alts.length === 0) return '';
  let html = '<div class="tp-stay-alt"><div class="tp-stay-alt-title">Also available:</div>';
  alts.forEach(a => {
    const tag = a.type === 'private' ? '🏠' : a.type === 'hostel' ? '🛏️' : '🏨';
    html += '<div class="tp-stay-alt-item"><div class="name">' + tag + ' ' + escHtml(a.name) + '</div>' +
      '<div class="meta">⭐ ' + (a.rating || 'N/A') + ' · €' + a.price_per_night + '/night' +
      (a.booking_url ? ' · <a href="' + a.booking_url + '" target="_blank" rel="noopener" style="color:var(--accent)">🔗 Book</a>' : '') +
      '</div></div>';
  });
  html += '</div>';
  return html;
}

function openCulture(encoded) {
  try {
    const culture = JSON.parse(decodeURIComponent(encoded));
    const popup = document.getElementById('culture-popup');
    const body = document.getElementById('culture-body');
    document.getElementById('culture-title').textContent = '📚 Culture & History — ' + (culture.title || '');

    let html = '';
    const sections = [
      {id: 'overview', icon: '🌍', label: 'Overview'},
      {id: 'history', icon: '📜', label: 'History & Heritage'},
      {id: 'architecture', icon: '🏛️', label: 'Architecture'},
      {id: 'culture', icon: '🎭', label: 'Local Culture & Customs'},
      {id: 'food', icon: '🍽️', label: 'Local Cuisine'},
      {id: 'people', icon: '👥', label: 'People & Traditions'},
      {id: 'regions', icon: '🗺️', label: 'Regions to Visit'},
      {id: 'tips', icon: '💡', label: 'Travel Tips'},
    ];

    sections.forEach(s => {
      const content = culture[s.id];
      if (!content) return;
      html += '<div class="culture-section">' +
        '<h4>' + s.icon + ' ' + s.label + '</h4>';
      if (Array.isArray(content)) {
        html += '<ul>' + content.map(item => '<li>' + escHtml(item) + '</li>').join('') + '</ul>';
      } else {
        html += '<p>' + escHtml(content) + '</p>';
      }
      html += '</div>';
    });

    body.innerHTML = html || '<p style="color:var(--text3)">Cultural information not available for this trip.</p>';
    popup.classList.add('active');
    document.body.style.overflow = 'hidden';
  } catch(e) {
    showFlash('Could not load culture data', 'info');
  }
}

function closeCulture() {
  document.getElementById('culture-popup').classList.remove('active');
  document.body.style.overflow = '';
}

function showFlash(msg, type) {
  const el = document.createElement('div');
  el.className = 'tp-flash ' + (type || 'success');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// ════════════════════════════════════════════════════════
// GOOGLE SIGN-IN
// ════════════════════════════════════════════════════════

function handleGoogleCredential(response) {
  // Decode the JWT credential to get user info
  try {
    const payload = JSON.parse(atob(response.credential.split('.')[1]));
    const email = payload.email;

    if (ALLOWED_EMAILS.includes(email)) {
      sessionStorage.setItem(SESSION_KEY, 'true');
      sessionStorage.setItem('portal_user', email);
      showDashboard();
    } else {
      const err = document.getElementById('log-error');
      err.textContent = '✗ This Google account (' + email + ') is not authorized.';
      err.style.display = 'block';
    }
  } catch(e) {
    const err = document.getElementById('log-error');
    err.textContent = '✗ Google sign-in failed. Try password login.';
    err.style.display = 'block';
  }
}

// Initialize Google Sign-In once library loads
window.onload = function() {
  if (typeof google !== 'undefined' && google.accounts) {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleCredential,
      cancel_on_tap_outside: false,
    });
    google.accounts.id.renderButton(
      document.getElementById('gbutton-wrap'),
      { theme: 'outline', size: 'large', type: 'standard', shape: 'pill', text: 'signin_with', logo_alignment: 'left' }
    );
  }
};

// ════════════════════════════════════════════════════════
// AUTO — check session on load
// ════════════════════════════════════════════════════════

(function() {
  if (sessionStorage.getItem(SESSION_KEY) === 'true') showDashboard();
})();
</script>
