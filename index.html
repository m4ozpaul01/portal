<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTAL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #f0f6fc;
      letter-spacing: 1px;
    }

    header h1 span { color: #58a6ff; }

    /* ── Browser-style Tabs ── */
    .tab-bar {
      display: flex;
      background: #0d1117;
      border-bottom: 1px solid #30363d;
      padding: 0 12px;
      overflow-x: auto;
      gap: 0;
    }

    .tab-bar::-webkit-scrollbar { height: 4px; }
    .tab-bar::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

    .browser-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      color: #8b949e;
      cursor: pointer;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      margin-right: 2px;
      margin-top: 6px;
      transition: all 0.15s;
      user-select: none;
      white-space: nowrap;
      background: transparent;
      position: relative;
    }

    .browser-tab:hover {
      color: #c9d1d9;
      background: #161b22;
      border-color: #21262d;
    }

    .browser-tab.active {
      color: #f0f6fc;
      background: #161b22;
      border-color: #30363d;
      border-bottom-color: #161b22;
      margin-bottom: -1px;
    }

    .browser-tab .tab-icon { font-size: 15px; }
    .browser-tab .tab-close {
      font-size: 14px;
      color: #484f58;
      padding: 0 2px;
      border-radius: 3px;
      line-height: 1;
      display: none;
    }
    .browser-tab:hover .tab-close { display: inline; }
    .browser-tab .tab-close:hover { color: #f85149; }

    /* ── Content Area ── */
    .content {
      flex: 1;
      padding: 24px 28px;
      background: #161b22;
    }

    .tab-panel {
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .tab-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── MOVIES Tab ── */
    .movies-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .movies-header h2 {
      font-size: 20px;
      color: #f0f6fc;
      font-weight: 600;
    }

    .movies-header .day-badge {
      background: #1f6feb;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
    }

    .movies-header .stats {
      margin-left: auto;
      font-size: 12px;
      color: #8b949e;
    }

    .movies-header .stats strong { color: #f0f6fc; }

    /* ── TRADING Tab ── */
    .trading-chart { margin: 16px 0; }
    .trading-chart svg { width: 100%; height: auto; display: block; }
    .trading-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; }
    .trading-table th { text-align: left; padding: 8px 10px; color: #484f58; font-weight: 600; font-size: 11px; border-bottom: 1px solid #21262d; text-transform: uppercase; letter-spacing: 0.5px; }
    .trading-table td { padding: 8px 10px; border-bottom: 1px solid #161b22; color: #8b949e; cursor: pointer; transition: background 0.1s; }
    .trading-table tr:hover td { background: #161b22; }
    .trading-table .win { color: #3fb950; font-weight: 600; }
    .trading-table .loss { color: #f85149; font-weight: 600; }
    .trading-stat-card { background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 14px; text-align: center; }
    .trading-stat-card .val { font-size: 20px; font-weight: 700; color: #f0f6fc; }
    .trading-stat-card .lbl { font-size: 10px; color: #484f58; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Modal ── */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; animation: fadeIn 0.15s ease; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 24px; max-width: 480px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
    .modal-box h3 { font-size: 18px; color: #f0f6fc; margin-bottom: 16px; }
    .modal-close { float: right; background: none; border: none; color: #484f58; font-size: 20px; cursor: pointer; padding: 0 4px; }
    .modal-close:hover { color: #f85149; }
    .modal-detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #21262d; font-size: 13px; }
    .modal-detail-row .label { color: #484f58; }
    .modal-detail-row .value { color: #c9d1d9; font-weight: 500; }

    .status-line {
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-line .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot.green { background: #3fb950; }
    .dot.yellow { background: #d29922; }
    .dot.gray { background: #484f58; }

    /* ── Movie Cards ── */
    .movie-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .movie-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 10px;
      transition: border-color 0.2s, box-shadow 0.2s;
      flex-wrap: wrap;
      position: relative;
    }

    .movie-card:hover {
      border-color: #30363d;
    }

    .movie-card.chosen {
      border-color: #d29922;
      box-shadow: 0 0 0 1px rgba(210, 153, 34, 0.2);
    }

    .movie-card.chosen::before {
      content: "★ Chosen";
      position: absolute;
      top: -1px;
      right: -1px;
      background: #d29922;
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 0 10px 0 8px;
    }

    .movie-card.watched {
      opacity: 0.6;
    }

    .movie-card .num {
      font-size: 18px;
      font-weight: 700;
      color: #484f58;
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }

    .movie-card .info {
      flex: 1;
      min-width: 140px;
    }

    .movie-card .info .title {
      font-size: 16px;
      font-weight: 600;
      color: #f0f6fc;
    }

    .movie-card .info .meta {
      font-size: 12px;
      color: #8b949e;
      margin-top: 2px;
    }

    .movie-card .imdb {
      color: #d29922;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      min-width: 50px;
    }

    /* ── Inline Star Rating (clickable) ── */
    .star-rating {
      display: flex;
      gap: 2px;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .star-rating span {
      color: #21262d;
      transition: color 0.1s, transform 0.1s;
      user-select: none;
    }

    .star-rating span.filled {
      color: #d29922;
    }

    .star-rating span:hover {
      transform: scale(1.2);
    }

    .rating-label {
      font-size: 11px;
      color: #484f58;
      white-space: nowrap;
      margin-left: 4px;
    }

    /* ── Buttons ── */
    .movie-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .btn {
      padding: 7px 12px;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-trailer {
      background: #1f6feb;
      color: #fff;
    }
    .btn-trailer:hover:not(:disabled) { background: #388bfd; }

    .btn-choose {
      background: #d29922;
      color: #fff;
    }
    .btn-choose:hover:not(:disabled) { background: #e3b341; }

    .btn-watched {
      background: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
    }
    .btn-watched:hover:not(:disabled) { background: #30363d; color: #c9d1d9; }

    .btn-watched.done {
      background: #238636;
      color: #fff;
      border-color: #238636;
    }

    .btn-done {
      background: #238636;
      color: #fff;
      cursor: default;
    }

    /* ── History ── */
    .history-section { margin-top: 8px; }

    .history-section h3 {
      font-size: 13px;
      font-weight: 600;
      color: #484f58;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
    }

    .history-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: #484f58;
      padding: 6px 10px;
      border-bottom: 1px solid #21262d;
    }

    .history-table td {
      padding: 8px 10px;
      font-size: 13px;
      border-bottom: 1px solid #0d1117;
    }

    .history-table td .h-title { color: #f0f6fc; font-weight: 500; }
    .history-table td .h-day { color: #484f58; font-size: 11px; }
    .history-table td .h-rating { color: #d29922; letter-spacing: 1px; }
    .history-table td .h-tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
    }
    .h-tag.chosen { background: #d29922; color: #fff; }
    .h-tag.watched { background: #484f58; color: #c9d1d9; }

    .empty-history {
      text-align: center;
      padding: 16px;
      color: #484f58;
      font-size: 13px;
    }

    /* ── Empty / Done state ── */
    .done-state {
      text-align: center;
      padding: 40px;
      color: #8b949e;
    }
    .done-state .big { font-size: 40px; margin-bottom: 8px; }
    .done-state h3 { color: #f0f6fc; margin-bottom: 6px; }

    /* ── Responsive ── */
    @media (max-width: 800px) {
      header { padding: 12px 16px; }
      .content { padding: 14px; }
      .movie-card { padding: 14px; gap: 10px; }
      .star-rating { font-size: 16px; }
      .movie-actions { width: 100%; justify-content: flex-end; }
    }

    /* ── Login Overlay ── */
    .login-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0d1117;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeIn 0.3s ease;
    }
    .login-overlay.hidden {
      display: none;
    }
    .login-box {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px 36px;
      width: 340px;
      max-width: 90%;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }
    .login-box h1 {
      font-size: 22px;
      color: #f0f6fc;
      text-align: center;
      margin-bottom: 4px;
    }
    .login-box h1 span { color: #58a6ff; }
    .login-box .sub {
      text-align: center;
      color: #484f58;
      font-size: 12px;
      margin-bottom: 28px;
    }
    .login-box label {
      display: block;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .login-box input {
      width: 100%;
      padding: 10px 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.15s;
    }
    .login-box input:focus {
      border-color: #58a6ff;
    }
    .login-box .login-btn {
      width: 100%;
      padding: 10px;
      background: #238636;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .login-box .login-btn:hover {
      background: #2ea043;
    }
    .login-box .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .login-error {
      color: #f85149;
      font-size: 12px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
    .login-error.show {
      display: block;
    }
  </style>
</head>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h1>⬡ <span>PORTAL</span></h1>
    <div class="sub">Sign in to enter</div>
    <div id="loginDayInfo" style="text-align:center;font-size:13px;color:#8b949e;margin-bottom:20px;"></div>
    <label for="loginUser">Username</label>
    <input type="text" id="loginUser" placeholder="Enter username" autocomplete="off">
    <label for="loginPass">Password</label>
    <input type="password" id="loginPass" placeholder="Enter password">
    <button class="login-btn" id="loginBtn" onclick="handleLogin()">Sign In</button>
    <div class="login-error" id="loginError">Invalid credentials. Try again.</div>
  </div>
</div>

<header>

  //  LOGIN GATE
  // ══════════════════════════════════════════════════════════════════════

  const LOGIN_USER = "m4oz";
  const LOGIN_HASH = "b34447c239a3831f511359efb8f8f7fd528fc485e824ea4a23d9ff611d7e2245";
  const SESSION_KEY = "portal_session";

  async function sha256(str) {
    const encoder = new TextEncoder();
    const data = encoder.encode(str);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function checkLogin() {
    const session = localStorage.getItem(SESSION_KEY);
    if (session === "m4oz_authenticated") {
      document.getElementById("loginOverlay").classList.add("hidden");
      return true;
    }
    return false;
  }

  async function handleLogin() {
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value;
    const btn = document.getElementById("loginBtn");
    const err = document.getElementById("loginError");

    if (!user || !pass) {
      err.textContent = "Please enter both username and password.";
      err.classList.add("show");
      return;
    }

    btn.disabled = true;
    btn.textContent = "Signing in...";

    const passHash = await sha256(pass);

    if (user === LOGIN_USER && passHash === LOGIN_HASH) {
      localStorage.setItem(SESSION_KEY, "m4oz_authenticated");
      document.getElementById("loginOverlay").classList.add("hidden");
    } else {
      err.textContent = "Invalid credentials. Try again.";
      err.classList.add("show");
      btn.disabled = false;
      btn.textContent = "Sign In";
      document.getElementById("loginPass").value = "";
    }
  }

  // Enter key submits login
  document.addEventListener("DOMContentLoaded", function() {
    document.getElementById("loginPass").addEventListener("keydown", function(e) {
      if (e.key === "Enter") handleLogin();
    });
    document.getElementById("loginUser").addEventListener("keydown", function(e) {
      if (e.key === "Enter") document.getElementById("loginPass").focus();
    });
  });

  // Run login check immediately
  checkLogin();

  const STORAGE_KEY = "portal_state";

  function getLatestAvailableDay() {
    const days = Object.keys(DAILY_MOVIES).map(Number).sort((a, b) => a - b);
    return days.length > 0 ? Math.max(...days) : 1;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        s.currentDay = s.currentDay || 1;
        s.chosenMovie = s.chosenMovie || null;
        s.watchedMovies = s.watchedMovies || [];
        s.movieRatings = s.movieRatings || {};   // { "Movie Title": rating (1-10) }
        s.completedDays = s.completedDays || [];
        s.history = s.history || [];
        s.activeTab = s.activeTab || "movies";
        // Auto-advance: if current day is completed (or has no movies), go to the
        // highest day that isn't completed yet. If all done, show the latest day.
        const latestDay = getLatestAvailableDay();
        if (s.completedDays.includes(s.currentDay) || !DAILY_MOVIES[s.currentDay]) {
          const availableDays = Object.keys(DAILY_MOVIES).map(Number).sort((a, b) => a - b);
          const nextUncompleted = availableDays.find(d => !s.completedDays.includes(d));
          s.currentDay = nextUncompleted || latestDay;
        }
        return s;
      }
    } catch {}
    const latestDay = getLatestAvailableDay();
    return {
      currentDay: latestDay,
      chosenMovie: null,
      watchedMovies: [],
      movieRatings: {},
      completedDays: [],
      history: [],
      activeTab: "movies"
    };
  }

  let state = loadState();

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function renderTabs() {
    const bar = document.getElementById("tabBar");
    bar.innerHTML = PROJECTS.map(p => `
      <div class="browser-tab ${state.activeTab === p.id ? 'active' : ''}" data-id="${p.id}">
        <span class="tab-icon">${p.icon}</span>
        ${p.label}
      </div>
    `).join("");

    bar.querySelectorAll(".browser-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        state.activeTab = tab.dataset.id;
        saveState();
        renderTabs();
        renderContent();
      });
    });
  }

    const container = document.getElementById("tabContent");
    const active = PROJECTS.find(p => p.id === state.activeTab);

    if (!active) {
      container.innerHTML = "<p style='color:#484f58;'>Select a project tab.</p>";

    if (active.type === "movies") {
      container.innerHTML = renderMoviesPanel();
      initMovieInteractions();
    } else if (active.type === "trading") {
      container.innerHTML = renderTradingPanel();
    } else {
      container.innerHTML = `<p style="color:#484f58;">Project: ${active.label}</p>`;
    }
  }

  function renderTradingPanel() {
    const data = loadTradingData();
    if (!data) {
      return `<p style="color:#484f58;">Loading trading data...</p>`;
    }

    const trades = data.trades || [];
    const balance = data.balance_history || [];
    const stats = data.stats || {};
    const reverseTrades = [...trades].reverse();

    // ── Stats cards ──
    const statsHtml = `
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;">
        <div class="trading-stat-card">
          <div class="val" style="color:#58a6ff;">€${stats.final_capital || 0}</div>
          <div class="lbl">Portfolio</div>
        </div>
        <div class="trading-stat-card">
          <div class="val" style="color:${stats.total_return_pct >= 0 ? '#3fb950' : '#f85149'};">${stats.total_return_pct >= 0 ? '+' : ''}${stats.total_return_pct || 0}%</div>
          <div class="lbl">Return</div>
        </div>
        <div class="trading-stat-card">
          <div class="val">${stats.total_trades || 0}</div>
          <div class="lbl">Trades</div>
        </div>
        <div class="trading-stat-card">
          <div class="val" style="color:#3fb950;">${stats.win_rate_pct || 0}%</div>
          <div class="lbl">Win Rate</div>
        </div>
      </div>
    `;

    // ── SVG Line Chart ──
    const chartW = 780, chartH = 200, padL = 60, padR = 20, padT = 20, padB = 30;
    const plotW = chartW - padL - padR;
    const plotH = chartH - padT - padB;

    let chartHtml = `<div class="trading-chart"><svg viewBox="0 0 ${chartW} ${chartH}" xmlns="http://www.w3.org/2000/svg">`;

    if (balance.length > 1) {
      const vals = balance.map(b => b.capital);
      const minV = Math.min(...vals) * 0.98;
      const maxV = Math.max(...vals) * 1.02;
      const range = maxV - minV || 1;

      const xScale = (i) => padL + (i / (balance.length - 1)) * plotW;
      const yScale = (v) => padT + plotH - ((v - minV) / range) * plotH;

      // Grid lines
      for (let g = 0; g <= 4; g++) {
        const y = padT + (g / 4) * plotH;
        const val = maxV - (g / 4) * range;
        chartHtml += `<line x1="${padL}" y1="${y}" x2="${chartW - padR}" y2="${y}" stroke="#1a1f2e" stroke-width="1"/>`;
        chartHtml += `<text x="${padL - 8}" y="${y + 4}" fill="#484f58" font-size="10" text-anchor="end">€${val.toFixed(0)}</text>`;
      }

      // Line path
      let pathD = balance.map((b, i) => `${i === 0 ? 'M' : 'L'}${xScale(i).toFixed(1)},${yScale(b.capital).toFixed(1)}`).join(' ');
      chartHtml += `<path d="${pathD}" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;

      // Area under line
      const firstX = xScale(0).toFixed(1);
      const lastX = xScale(balance.length - 1).toFixed(1);
      const bottomY = (padT + plotH).toFixed(1);
      chartHtml += `<path d="${pathD}L${lastX},${bottomY}L${firstX},${bottomY}Z" fill="url(#grad)" opacity="0.15"/>`;

      // Gradient def
      chartHtml += `<defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#58a6ff"/><stop offset="100%" stop-color="#0d1117"/></linearGradient></defs>`;

      // Dots on every 5th trade
      balance.forEach((b, i) => {
        if (i % 5 === 0 || i === balance.length - 1) {
          const cx = xScale(i).toFixed(1), cy = yScale(b.capital).toFixed(1);
          chartHtml += `<circle cx="${cx}" cy="${cy}" r="3" fill="#58a6ff"/>`;
        }
      });

      // X-axis date labels (first, middle, last)
      [0, Math.floor(balance.length / 2), balance.length - 1].forEach(idx => {
        if (balance[idx]) {
          const x = xScale(idx).toFixed(1);
          chartHtml += `<text x="${x}" y="${chartH - 6}" fill="#484f58" font-size="9" text-anchor="middle">${balance[idx].date}</text>`;
        }
      });
    }

    chartHtml += '</svg></div>';

    // ── Transaction Table ──
    let tableHtml = `
      <div style="margin-top:20px;">
        <h3 style="color:#f0f6fc;font-size:15px;margin-bottom:10px;">📋 Transactions</h3>
        <div style="max-height:400px;overflow-y:auto;">
          <table class="trading-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Date</th>
                <th>Symbol</th>
                <th>Direction</th>
                <th>Entry</th>
                <th>Exit</th>
                <th>P&amp;L</th>
                <th>Result</th>
              </tr>
            </thead>
            <tbody>
    `;

    reverseTrades.forEach((t, i) => {
      const cls = t.result === "win" ? "win" : "loss";
      const sign = t.pnl >= 0 ? "+" : "";
      tableHtml += `
        <tr onclick="showTradeDetail(${t.trade})" style="cursor:pointer;">
          <td style="color:#484f58;">${t.trade}</td>
          <td>${t.date}</td>
          <td style="color:#c9d1d9;">${t.symbol}</td>
          <td>${t.direction === "long" ? "🟢 Long" : "🔴 Short"}</td>
          <td>€${t.entry.toFixed(t.entry < 1 ? 5 : 2)}</td>
          <td>€${t.exit.toFixed(t.exit < 1 ? 5 : 2)}</td>
          <td class="${cls}">${sign}€${t.pnl.toFixed(2)}</td>
          <td class="${cls}">${t.result === "win" ? "✅ Win" : "❌ Loss"}</td>
        </tr>
      `;
    });

    tableHtml += `
            </tbody>
          </table>
        </div>
      </div>
    `;

    // ── Modal overlay ──
    const modalHtml = `
      <div class="modal-overlay" id="tradeModal">
        <div class="modal-box">
          <button class="modal-close" onclick="hideTradeModal()">✕</button>
          <h3 id="modalTitle">Trade Details</h3>
          <div id="modalBody"></div>
        </div>
      </div>
    `;

    return `
      <div style="max-width:900px;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px;">
          <h2 style="font-size:22px;color:#f0f6fc;font-weight:600;">📈 TRADING</h2>
          <span style="background:#1f6feb;color:#fff;font-size:11px;font-weight:600;padding:3px 10px;border-radius:12px;">4H Range Scalp</span>
        </div>
        <p style="color:#484f58;font-size:12px;margin-bottom:16px;">Simulation: €200 → €${stats.final_capital || 0} over ${stats.total_trades || 0} trades</p>
        ${statsHtml}
        ${chartHtml}
        ${tableHtml}
        ${modalHtml}
      </div>
    `;
  }

  function loadTradingData() {
    return TRADING_DATA || null;
  }

  function showTradeDetail(tradeNum) {
    const data = loadTradingData();
    if (!data) return;
    const trade = data.trades.find(t => t.trade === tradeNum);
    if (!trade) return;

    document.getElementById("modalTitle").textContent = `Trade #${tradeNum} — ${trade.symbol}`;
    const riskAmt = trade.risk_amount || 0;
    const rangeSize = Math.abs(trade.sl - trade.entry);
    const rMultiple = trade.pnl / riskAmt;

    document.getElementById("modalBody").innerHTML = `
      <div class="modal-detail-row"><span class="label">Date</span><span class="value">${trade.date}</span></div>
      <div class="modal-detail-row"><span class="label">Symbol</span><span class="value">${trade.symbol}</span></div>
      <div class="modal-detail-row"><span class="label">Direction</span><span class="value">${trade.direction === "long" ? "🟢 Long" : "🔴 Short"}</span></div>
      <div class="modal-detail-row"><span class="label">Entry Price</span><span class="value">€${trade.entry.toFixed(trade.entry < 1 ? 5 : 2)}</span></div>
      <div class="modal-detail-row"><span class="label">Stop Loss</span><span class="value">€${trade.sl.toFixed(trade.sl < 1 ? 5 : 2)}</span></div>
      <div class="modal-detail-row"><span class="label">Take Profit</span><span class="value">€${trade.tp.toFixed(trade.tp < 1 ? 5 : 2)}</span></div>
      <div class="modal-detail-row"><span class="label">Exit Price</span><span class="value">€${trade.exit.toFixed(trade.exit < 1 ? 5 : 2)}</span></div>
      <div class="modal-detail-row"><span class="label">Range Size</span><span class="value">€${rangeSize.toFixed(rangeSize < 1 ? 5 : 2)}</span></div>
      <div class="modal-detail-row"><span class="label">Risk Amount</span><span class="value">€${riskAmt.toFixed(2)}</span></div>
      <div class="modal-detail-row"><span class="label">P&amp;L</span><span class="value" style="color:${trade.pnl >= 0 ? '#3fb950' : '#f85149'};font-weight:700;">${trade.pnl >= 0 ? '+' : ''}€${trade.pnl.toFixed(2)}</span></div>
      <div class="modal-detail-row"><span class="label">R-Multiple</span><span class="value">${rMultiple.toFixed(2)}R</span></div>
      <div class="modal-detail-row"><span class="label">Result</span><span class="value" style="color:${trade.result === 'win' ? '#3fb950' : '#f85149'};font-weight:700;">${trade.result === "win" ? "✅ Win" : "❌ Loss"}</span></div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid #21262d;">
        <p style="color:#484f58;font-size:12px;">
          ${trade.result === "win"
            ? `Price hit take profit at €${trade.tp.toFixed(trade.tp < 1 ? 5 : 2)}. Profit: €${trade.pnl.toFixed(2)} (${rMultiple.toFixed(1)}R).`
            : `Price hit stop loss at €${trade.sl.toFixed(trade.sl < 1 ? 5 : 2)}. Loss: €${Math.abs(trade.pnl).toFixed(2)} (${Math.abs(rMultiple).toFixed(1)}R).`}
        </p>
      </div>
    `;
    document.getElementById("tradeModal").classList.add("active");
  }

  function hideTradeModal() {
    document.getElementById("tradeModal").classList.remove("active");
  }

  // Close modal on overlay click
  document.addEventListener("click", function(e) {
    if (e.target.classList && e.target.classList.contains("modal-overlay")) {
      hideTradeModal();
    }
  });

  // ══════════════════════════════════════════════════════════════════════
  //  MOVIES PANEL
  // ══════════════════════════════════════════════════════════════════════

  function renderMoviesPanel() {
    const movies = DAILY_MOVIES[state.currentDay];
    const dayDone = state.completedDays.includes(state.currentDay);
    const chosen = state.chosenMovie;

    let statusHtml = "";
    if (dayDone) {
      if (chosen && state.movieRatings[chosen.title]) {
        statusHtml = `<span class="dot green"></span> Day ${state.currentDay} done! You rated "${chosen.title}" ${state.movieRatings[chosen.title]}/10. Tomorrow at 7pm I'll find new ones based on your taste!`;
      } else if (chosen) {
        statusHtml = `<span class="dot green"></span> Day ${state.currentDay} done! You chose "${chosen.title}".`;
      } else {
        statusHtml = `<span class="dot green"></span> Day ${state.currentDay} done — all marked as watched!`;
      }
    } else {
      statusHtml = `<span class="dot yellow"></span> Pick a movie for tonight! 🍿`;
    }

    const statsHtml = `
      <span>Watched: <strong>${state.history.filter(h => h.action === "chosen" || h.action === "watched").length}</strong></span>
      <span>Rated: <strong>${Object.keys(state.movieRatings).length}</strong></span>
      <span>Days: <strong>${state.completedDays.length}</strong></span>
    `;

    if (!movies) {
      return `
        <div class="movies-header"><h2>🎬 MOVIES</h2><span class="day-badge">Day ${state.currentDay}</span></div>
        <div class="done-state">
          <div class="big">🎉</div>
          <h3>All caught up!</h3>
          <p style="color:#484f58;">Kity hasn't prepared Day ${state.currentDay} yet. New picks arrive at 7pm!</p>
        </div>
        <div class="history-section">${renderHistory()}</div>
      `;
    }

    return `
      <div class="movies-header">
        <h2>🎬 MOVIES</h2>
        <span class="day-badge">Day ${state.currentDay}</span>
        <div class="stats">${statsHtml}</div>
      </div>
      <div class="status-line">${statusHtml}</div>

      <div class="movie-list">
        ${movies.map((m, i) => renderMovieCard(m, i, dayDone)).join("")}
      </div>

      <div class="history-section">
        <h3>📜 Watch History</h3>
        ${renderHistory()}
      </div>
    `;
  }

  function renderMovieCard(m, i, dayDone) {
    const chosen = state.chosenMovie;
    const isChosen = chosen && chosen.title === m.title;
    const isWatched = state.watchedMovies.includes(m.title);
    const rating = state.movieRatings[m.title] || 0;
    const dayDoneFlag = dayDone || isChosen;

    let cardClass = "movie-card";
    if (isChosen) cardClass += " chosen";
    else if (isWatched) cardClass += " watched";

    // Build clickable stars
    let starsHtml = "";
    for (let s = 1; s <= 10; s++) {
      starsHtml += `<span data-movie="${m.title}" data-star="${s}" class="${s <= rating ? 'filled' : ''}">★</span>`;
    }

    // Disable choose button if another movie is already chosen
    const chooseDisabled = dayDone || (chosen && !isChosen);
    // Disable watched button if chosen or day done
    const watchedDisabled = dayDone || isChosen;

    return `
      <div class="${cardClass}" data-movie="${m.title}">
        <span class="num">${i + 1}</span>
        <div class="info">
          <div class="title">${m.title}</div>
          <div class="meta">${m.year} · ${m.genre} · ${m.length} · ${m.director}</div>
          <div class="meta" style="font-size:11px;color:#30363d;">${m.cast}</div>
          <div style="margin-top:4px;font-size:11px;color:#8b949e;">${m.synopsis}</div>
        </div>
        <div class="imdb">★ ${m.imdb}</div>

        <!-- Clickable star rating (1-10) -->
        <div class="star-rating" data-movie="${m.title}">
          ${starsHtml}
        </div>
        ${rating > 0 ? `<span class="rating-label">${rating}/10</span>` : ''}

        <div class="movie-actions">
          <a class="btn btn-trailer" href="${m.trailer}" target="_blank" rel="noopener">▶ Trailer</a>
          <button class="btn btn-choose" data-movie="${m.title}" ${chooseDisabled ? 'disabled' : ''}>
            ${isChosen ? '★ Chosen' : 'I choose this one'}
          </button>
          <button class="btn btn-watched ${isWatched ? 'done' : ''}" data-movie="${m.title}" ${watchedDisabled ? 'disabled' : ''}>
            ${isWatched ? '✓ Seen' : 'Already watched'}
          </button>
        </div>
      </div>
    `;
  }

  // ══════════════════════════════════════════════════════════════════════
  //  MOVIE INTERACTIONS
  // ══════════════════════════════════════════════════════════════════════

  function initMovieInteractions() {
    // ── Star Ratings ──
    document.querySelectorAll(".star-rating span").forEach(star => {
      const movie = star.dataset.movie;
      const starVal = parseInt(star.dataset.star);

      star.addEventListener("mouseenter", () => {
        if (state.completedDays.includes(state.currentDay)) return;
        const all = star.parentElement.querySelectorAll("span");
        all.forEach(s => s.classList.toggle("filled", parseInt(s.dataset.star) <= starVal));
      });

      star.addEventListener("mouseleave", () => {
        if (state.completedDays.includes(state.currentDay)) return;
        const all = star.parentElement.querySelectorAll("span");
        const currentRating = state.movieRatings[movie] || 0;
        all.forEach(s => s.classList.toggle("filled", parseInt(s.dataset.star) <= currentRating));
      });

      star.addEventListener("click", () => {
        if (state.completedDays.includes(state.currentDay)) return;
        
        state.movieRatings[movie] = starVal;

        // Update or add to history
        const existing = state.history.find(h => h.title === movie && h.day === state.currentDay);
        if (existing) {
          existing.rating = starVal;
        } else {
          state.history.push({ day: state.currentDay, title: movie, action: "rated", rating: starVal });
        }

        // If this movie is also the chosen one, mark the day complete
        if (state.chosenMovie && state.chosenMovie.title === movie) {
          if (!state.completedDays.includes(state.currentDay)) {
            state.completedDays.push(state.currentDay);
          }
        }

        saveState();
        renderContent();
        initMovieInteractions();
      });
    });

    // ── Choose ──
    document.querySelectorAll(".btn-choose").forEach(btn => {
      btn.addEventListener("click", () => {
        const movie = btn.dataset.movie;
        if (state.completedDays.includes(state.currentDay)) return;

        state.chosenMovie = { title: movie, rating: null };
        if (!state.watchedMovies.includes(movie)) {
          state.watchedMovies.push(movie);
        }
        saveState();
        renderContent();
        initMovieInteractions();
      });
    });

    // ── Watched ──
    document.querySelectorAll(".btn-watched").forEach(btn => {
      btn.addEventListener("click", () => {
        const movie = btn.dataset.movie;
        if (state.completedDays.includes(state.currentDay)) return;
        if (state.chosenMovie && state.chosenMovie.title === movie) return;

        if (!state.watchedMovies.includes(movie)) {
          state.watchedMovies.push(movie);
        }

        // Add to history
        state.history.push({ day: state.currentDay, title: movie, action: "watched" });

        // Check if all movies are accounted for
        const movies = DAILY_MOVIES[state.currentDay];
        if (movies) {
          const accounted = movies.filter(m =>
            state.watchedMovies.includes(m.title) && m.title !== state.chosenMovie?.title
          );
          // If chosen movie + all others watched = day done
          if ((state.chosenMovie && accounted.length === movies.length - 1) ||
              (!state.chosenMovie && accounted.length === movies.length)) {
            state.completedDays.push(state.currentDay);
          }
        }

        saveState();
        renderContent();
        initMovieInteractions();
      });
    });
  }

  // ══════════════════════════════════════════════════════════════════════
  //  HISTORY
  // ══════════════════════════════════════════════════════════════════════

  function renderHistory() {
    if (state.history.length === 0) {
      return '<div class="empty-history">No movies yet. Pick one above!</div>';
    }

    return `
      <table class="history-table">
        <thead><tr>
          <th>Day</th>
          <th>Movie</th>
          <th>Action</th>
          <th>Rating</th>
        </tr></thead>
        <tbody>
          ${state.history.slice().reverse().map(h => {
            const tagClass = h.action === "chosen" ? "chosen" : "watched";
            const tagText = h.action === "chosen" ? "★ Watched" : "✓ Seen before";
            const stars = h.rating ? `<span class="h-rating">${'★'.repeat(h.rating)} ${h.rating}/10</span>` : `<span style="color:#484f58;">—</span>`;
            return `<tr>
              <td><span class="h-day">Day ${h.day}</span></td>
              <td><span class="h-title">${h.title}</span></td>
              <td><span class="h-tag ${tagClass}">${tagText}</span></td>
              <td>${stars}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    `;
  }

  // ══════════════════════════════════════════════════════════════════════
  //  INIT
  // ══════════════════════════════════════════════════════════════════════

  // Show current day on login screen
  (function showLoginDay() {
    const day = getLatestAvailableDay();
    const el = document.getElementById("loginDayInfo");
    if (el) el.textContent = "🎬 Day " + day + " movies waiting for you!";
  })();

  renderTabs();
  renderContent();
</script>
