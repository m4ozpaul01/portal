<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Login Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0d15;color:#e8e8ed;font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:rgba(255,255,255,0.04);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:48px 40px;width:100%;max-width:400px;text-align:center}
.card h1{font-size:24px;font-weight:600;margin-bottom:4px;background:linear-gradient(135deg,#818cf8,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card .sub{color:#8e8ea0;font-size:13px;margin-bottom:28px}
.card label{display:block;font-size:12px;color:#8e8ea0;margin-bottom:4px;font-weight:500;text-align:left}
.card input{width:100%;padding:12px 14px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#e8e8ed;font-size:14px;outline:none;margin-bottom:16px}
.card input:focus{border-color:#6366f1}
.card button{width:100%;padding:12px;background:#6366f1;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.card button:hover{background:#5558e6;box-shadow:0 0 20px rgba(99,102,241,0.25)}
.error{display:none;color:#f87171;font-size:13px;margin-top:12px}
.success{display:none;color:#34d399;font-size:14px;margin-top:12px;padding:12px;background:rgba(52,211,153,0.12);border-radius:8px}
.debug{font-size:11px;color:#5c5c6e;margin-top:20px;text-align:left;font-family:monospace;white-space:pre-wrap;border-top:1px solid rgba(255,255,255,0.08);padding-top:16px}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:48px;margin-bottom:16px">🔐</div>
  <h1>Portal Login Test</h1>
  <p class="sub">Minimal login — zero dependencies</p>

  <form id="login-form" autocomplete="off">
    <label>Username</label>
    <input type="text" id="login-user" value="m4oz" autofocus>

    <label>Password</label>
    <input type="password" id="login-pass" placeholder="••••••••">

    <button type="submit" id="login-btn">🔐 Login</button>

    <div class="error" id="login-error">Invalid credentials</div>
    <div class="success" id="login-success">✅ Login successful! Portal would open.</div>
  </form>

  <div class="debug" id="debug"></div>
</div>

<script>
// ════════════════════════════════════════
// HARDCODED CREDENTIALS
// ════════════════════════════════════════

const USERS = [
  { user: "m4oz",   hash: "S2FsYWZpb3IwMQ==" },  // Kalafior01
  { user: "sweetie", hash: "TWFqYTIwMjYh" }       // Maja2026!
];

// ════════════════════════════════════════
// LOGIN
// ════════════════════════════════════════

const form = document.getElementById('login-form');
const userInput = document.getElementById('login-user');
const passInput = document.getElementById('login-pass');
const errorEl = document.getElementById('login-error');
const successEl = document.getElementById('login-success');
const debugEl = document.getElementById('debug');

function log(msg) {
  debugEl.textContent += msg + '\n';
}

log('=== PORTAL LOGIN DIAGNOSTIC ===');
log('Page loaded: ' + new Date().toISOString());
log('Browser: ' + navigator.userAgent.substring(0, 60));
log('btoa available: ' + (typeof btoa === 'function'));

// Test btoa with known password
const testHash = btoa('Kalafior01');
log('btoa(Kalafior01) = ' + testHash);
log('Stored hash      = ' + USERS[0].hash);
log('Match: ' + (testHash === USERS[0].hash ? 'YES' : 'NO'));

form.addEventListener('submit', function(e) {
  e.preventDefault();
  
  const user = userInput.value.trim();
  const pass = passInput.value;
  
  log('\n--- Login attempt ---');
  log('Username: "' + user + '"');
  log('Password length: ' + pass.length + ' chars');
  log('Password bytes: ' + pass.split('').map(c => c.charCodeAt(0)).join(','));
  
  try {
    const encoded = btoa(pass);
    log('btoa result: "' + encoded + '"');
    
    const match = USERS.find(c => c.user === user && c.hash === encoded);
    log('Match found: ' + (match ? match.user : 'NONE'));
    
    if (match) {
      errorEl.style.display = 'none';
      successEl.style.display = 'block';
      log('✅ LOGIN SUCCESSFUL');
    } else {
      errorEl.style.display = 'block';
      successEl.style.display = 'none';
      log('❌ LOGIN FAILED');
      
      // Show what the stored hash is for this user
      const stored = USERS.find(c => c.user === user);
      if (stored) {
        log('Stored hash for "' + user + '": "' + stored.hash + '"');
        log('Your btoa: "' + encoded + '"');
        log('Hashes match: ' + (encoded === stored.hash));
      } else {
        log('User "' + user + '" not found in credentials');
      }
    }
  } catch (err) {
    log('❌ btoa ERROR: ' + err.message);
    errorEl.textContent = 'Error: ' + err.message;
    errorEl.style.display = 'block';
  }
});
</script>
</body>
</html>
